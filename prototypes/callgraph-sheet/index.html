    <!--
      ==========================================================================
      PROTOTYPE — throwaway. Sheet D-01.

      Answers: "what does the call graph look like as a drawing, and does the
      drawing stay honest while you step it?"

      SOURCE FILE. This is the template, not the deliverable.
      Run build.ps1 to splice in the fonts, drafting.css and the programs and
      produce index.html — one self-contained file, no network at all.

      THERE IS NO ENGINE HERE. #28 was amended to "the artifact steps over a
      recorded walk", so nothing on this page computes a next state: each
      program carries its walk as data, and this file plays it. The VM did not
      die, it moved to record time — record.mjs lifts it out of D-00, runs it
      once offline and writes the tape into the IR. The IR is the product; a
      viewer is a view; the walk is a claim the viewer only replays.

      DESIGN: Drafting / Aviation. Four colours, and two of them are budgets.
        ink        structure. Line weight is the depth system: 1px construction,
                   1.5px leader/dimension, 2px object outline.
        caution    attention required — a fired error, a failed effect, a
                   breakpoint. Never a declared one. A `throw` in the source is
                   code; a throw that happened is a caution.
        normal     nominal — a frame that returned, an effect that landed.
        No radius, no shadow, no gradient, no icon set, no emoji. Drawing
        notation carries what icons would: leader lines with terminal dots,
        witness ticks, dimension arrowheads, a dashed cutaway, a title block.
      ==========================================================================
    -->

    <style>
      /* ============================================================================
   DRAFTING — a technical-manual design system
   ----------------------------------------------------------------------------
   Vintage aircraft engineering drawing / maintenance manual.
   Framework-agnostic: plain custom properties + classes. No build step, no
   Tailwind dependency. Consumable by an Astro site, a plain-HTML slide deck,
   or anything else that can load a stylesheet.

   THE RULES (these are the system; everything else is convenience)
     1. Four colours exist: paper, ink, caution, normal. Nothing else.
     2. Amber is ONLY caution / problem / attention-required.
     3. Green is ONLY normal / monitored / nominal.
        A colour that means "this is fine" must never be spent on decoration —
        the moment green is decorative, green stops meaning anything.
     4. Every neutral is ink at reduced alpha, never a sampled grey. This is
        what keeps the page reading as one ink on one paper.
     5. No gradients. No drop shadows. No photographs. Depth comes from line
        weight, the way it does on a real drawing.

   FONT: this file does not ship a font. Provide IBM Plex Mono (or JetBrains
   Mono) yourself — Fontsource on a site, an inlined @font-face data URI in a
   standalone deck — then the stack below resolves. It degrades to ui-monospace
   rather than silently rendering in a proportional face.
   ========================================================================== */

:root {
  /* -- Ground ------------------------------------------------------------- */
  --dw-paper: #fafaf7;
  --dw-ink: #22262b;

  /* -- Semantic state. Reserved. See rules 2 and 3. ------------------------ */
  --dw-caution: #d97706;
  --dw-normal: #15803d;

  /* -- Ink at alpha. The only greys in the system. ------------------------- */
  --dw-ink-80: rgb(34 38 43 / 0.8); /* secondary prose            */
  --dw-ink-55: rgb(34 38 43 / 0.55); /* annotation, captions       */
  --dw-ink-30: rgb(34 38 43 / 0.3); /* hairlines, leader lines    */
  --dw-ink-12: rgb(34 38 43 / 0.12); /* light rules, cell dividers */
  --dw-grid: rgb(34 38 43 / 0.05); /* the drafting grid          */

  /* -- Line weights. Drawing convention: outlines heavy, construction light. */
  --dw-rule-hair: 1px; /* grid, construction        */
  --dw-rule-thin: 1.5px; /* dimensions, leaders       */
  --dw-rule-bold: 2px; /* object outline, frames    */

  /* -- Grid pitch --------------------------------------------------------- */
  --dw-grid-size: 24px;

  /* -- Type --------------------------------------------------------------- */
  /* IBM Plex Mono ships with this package (latin, 400/500/600) via fonts.css.
     Only faces we actually ship are named — advertising one we don't would
     promise a rendering the system can't deliver. Swap this token if you
     vendor a different mono. */
  --dw-font: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas,
    monospace;

  /* Optional prose escape. Long-form reading in full monospace is measurably
     slower; a site with multi-hundred-word body copy may point this at a
     proportional face. Labels, data, and annotation stay mono regardless —
     that is where the manual's character actually lives. Default: no escape. */
  --dw-font-prose: var(--dw-font);

  --dw-t-micro: 0.6875rem; /* 11px — cell captions, sheet numbers */
  --dw-t-annot: 0.8125rem; /* 13px — callouts, annotations        */
  --dw-t-body: 0.9375rem; /* 15px — body                         */
  --dw-t-lead: 1.125rem; /* 18px — lead paragraph               */
  --dw-t-h3: 1.375rem; /* 22px                                */
  --dw-t-h2: 1.875rem; /* 30px                                */
  --dw-t-h1: 2.75rem; /* 44px — section title                */
  --dw-t-slide: 4rem; /* 64px — slide title                  */

  --dw-track-label: 0.16em; /* caps tracking, small sizes */
  --dw-track-title: 0.12em; /* caps tracking, large sizes */

  /* -- Space. Multiples of the grid pitch, so rhythm stays on the grid. ---- */
  --dw-s1: 6px;
  --dw-s2: 12px;
  --dw-s3: 24px;
  --dw-s4: 36px;
  --dw-s5: 48px;
  --dw-s6: 72px;
}

/* ============================================================================
   GROUND
   ========================================================================== */

.dw-paper {
  background-color: var(--dw-paper);
  color: var(--dw-ink);
  font-family: var(--dw-font);
  font-size: var(--dw-t-body);
  line-height: 1.6;
}

/* The drafting grid. Two hairline gradients, nothing more. */
.dw-grid {
  background-image: linear-gradient(
      to right,
      var(--dw-grid) var(--dw-rule-hair),
      transparent var(--dw-rule-hair)
    ),
    linear-gradient(to bottom, var(--dw-grid) var(--dw-rule-hair), transparent var(--dw-rule-hair));
  background-size: var(--dw-grid-size) var(--dw-grid-size);
}

/* Sheet frame — the ruled border a drawing sits inside. */
.dw-sheet {
  border: var(--dw-rule-bold) solid var(--dw-ink);
  padding: var(--dw-s4);
}

/* ============================================================================
   TYPE
   ========================================================================== */

.dw-slide-title,
.dw-h1,
.dw-h2 {
  text-transform: uppercase;

           10rem 1:1.46   4/10        3/5     <- #33 delta 2 proposed this
           12rem 1:1.55   6/10        5/5     <- the knee

           22rem 1:2.26  10/10        5/5

    "applySettings": {
      "name": "applySettings — woodwork slice",
      "kind": "handler",
      "loc": "packages/site/src/shelf/scene.ts:2225",
      "params": [
        "mountedWith",
        "current",
        "next",
        "built"
      ],
      "channels": {

        "E": [],
        "R": [
          "THREE",
          "woodwork.ts"
        ]
      },
      "steps": [
        {
          "op": "note",
          "note": "Five report lists. applied / needsRebuild / needsReload / refused are transitions; resolved is a statement."
        },
        {
          "op": "let",
          "name": "applied",
          "expr": "[]"
        },
        {
          "op": "let",
          "name": "needsRebuild",
          "expr": "[]"
        },
        {
          "op": "let",
          "name": "refused",
          "expr": "[]"
        },
        {
          "op": "if",
          "cond": "current.materials.woodFibre !== next.materials.woodFibre",
          "then": "fibre",
          "else": "holdFibre"
        },
        {
          "op": "call",
          "label": "fibre",
          "target": "applyWoodFibre",
          "args": {
            "scale": "next.materials.woodFibre",
            "lay": "built.lay"
          },
          "bind": "fibreInForce",
          "note": "laid by the sheet the shelf was BUILT with, not by the module's default constant"
        },
        {
          "op": "if",
          "cond": "fibreInForce === next.materials.woodFibre",
          "then": "fibreOk",
          "else": "fibreNo"
        },
        {
          "op": "let",
          "label": "fibreOk",
          "name": "applied",
          "expr": "applied.concat('wood fibre: ' + current.materials.woodFibre + ' → ' + fibreInForce)"
        },
        {
          "op": "goto",
          "to": "species"
        },
        {
          "op": "let",
          "label": "fibreNo",
          "name": "refused",
          "expr": "refused.concat('wood fibre: there is no canvas to draw it on, so the woodwork stays smooth')"
        },
        {
          "op": "goto",
          "to": "species"
        },
        {
          "op": "let",
          "label": "holdFibre",
          "name": "fibreInForce",
          "expr": "built.fibre",
          "note": "not applied and not asked for — but still reported, so a fibre that never bound says so on every apply after the one that discovered it"
        },
        {
          "op": "call",
          "label": "species",
          "target": "speciesPending",
          "args": {
            "built": "mountedWith.materials.woodSpecies",
            "wanted": "next.materials.woodSpecies"
          },
          "bind": "pending"
        },
        {
          "op": "if",
          "cond": "pending",
          "then": "rebuild",
          "else": "readback"
        },
        {
          "op": "let",
          "label": "rebuild",
          "name": "needsRebuild",
          "expr": "needsRebuild.concat('woodwork sheet: ' + built.species + ' → ' + next.materials.woodSpecies)"

          "op": "call",

          "op": "call",
          "target": "describeWoodwork",

    <script>
      /* ======================================================================
         THE IR, CHECKED — no evaluation, so no VM.

         prepare() only indexes; validate() only cross-references. Both used to
         be lifted out of D-00 along with the step() VM. They stay because the
         drawer accepts a pasted program and a graph that names a node it has
         not got should be refused before it is drawn, not after.
         ==================================================================== */
      let PROG = null;

      function prepare(prog) {
        prog._labels = {};
        for (const [id, node] of Object.entries(prog.nodes)) {
          node.id = id;
          const m = {};
          node.steps.forEach((s, i) => {
            if (s.label) m[s.label] = i;
          });
          prog._labels[id] = m;
        }
        return prog;
      }

      function validate(prog) {
        const errs = [];
        if (!prog.entry || !prog.nodes?.[prog.entry]) errs.push('entry node missing');
        for (const [id, node] of Object.entries(prog.nodes || {})) {
          const labels = prog._labels[id];
          node.steps.forEach((s, i) => {
            const where = `${id}[${i}] ${s.op}`;
            if (s.op === 'call' && !prog.nodes[s.target])
              errs.push(`${where}: unknown target "${s.target}"`);
            for (const key of ['then', 'else', 'to']) {
              if (s[key] !== undefined && labels[s[key]] === undefined)
                errs.push(`${where}: unknown label "${s[key]}"`);
            }
            for (const h of s.onError || []) {
              if (labels[h.goto] === undefined)
                errs.push(`${where}: onError → unknown label "${h.goto}"`);
            }
          });
        }
        (prog.presets || []).forEach((pr, i) => {
          for (const e of walkErrors(prog, pr.walk)) errs.push(`preset[${i}] ${pr.name}: ${e}`);
        });
        return errs;
      }

      /**
       * A walk is a claim, so it is checkable. Every move names a node that must
       * exist and a step index inside it that must be in range, and the frame
       * arithmetic must balance — a walk that pops an empty stack, or points at
       * step 40 of a ten-step node, is a broken claim and says so here rather
       * than rendering as a plausible-looking drawing.
       */
      function walkErrors(prog, walk) {
        const out = [];
        if (!walk) return ['no walk — this preset records nothing to step over'];
        if (!Array.isArray(walk.steps) || !walk.steps.length) return ['walk.steps is empty'];
        if (walk.steps[0].k !== 'enter') out.push('walk does not open with an enter move');
        const stack = [];
        walk.steps.forEach((m, i) => {
          const at = `move ${i} (${m.k})`;
          if (m.k === 'enter') {
            if (!prog.nodes[m.node]) return void out.push(`${at}: unknown node "${m.node}"`);
            return void stack.push(m.node);
          }
          // the two terminal moves land after the last frame has gone
          if (m.k === 'done' || m.k === 'uncaught') return;
          const here = stack[stack.length - 1];
          if (!here) return void out.push(`${at}: no frame is open`);
          const n = prog.nodes[here];
          if (m.at !== undefined && (m.at < 0 || m.at > n.steps.length))
            out.push(`${at}: step ${m.at} is out of range in ${n.name} (${n.steps.length} steps)`);
          if (m.k === 'call') {
            if (!prog.nodes[m.to]) out.push(`${at}: unknown target "${m.to}"`);
            else stack.push(m.to);
          }
          if (m.k === 'return' || m.k === 'unwind') stack.pop();
        });
        if (stack.length && !walk.steps.some((m) => m.k === 'uncaught'))
          out.push(`walk ends with ${stack.length} frame(s) still open`);
        return out;
      }

      /* ======================================================================
         THE PLAYER — an index over a recorded walk.

         #28, amended: the artifact steps over a recorded walk and there is no
         engine. The rule that keeps that true is THE PLAYER MAY DERIVE, NEVER
         DECIDE. Which branch an `if` took, what an effect returned, whether a
         handler caught — every one of those is a literal in the tape. What
         happens below is bookkeeping: push a frame, pop a frame, append a
         ledger row, move a cursor. Nothing is evaluated, and `new Function` —
         which the VM needed for every `let`, `if` and effect argument — is
         gone from this page entirely.

         The fold runs once per load, so `Back` and the dimension line seek by
         subscript rather than by recomputing anything.
         ==================================================================== */
      let WALK = null;
      let TRACE = [];
      let T = 0;
      let SEL = null; // stack index being inspected, null = top
      let PIN = null; // node pinned into the cutaway by clicking it
      let TAB = 'source'; // which view of the opened node the cutaway shows
      let VIEW = 'drawing'; // drawing | tree — what the sheet is read as
      let LAYER = 'production'; // which R the graph is drawn against (#34)
      const BP = new Set();
      const OPT = { breakEffect: false, breakError: true };
      let PLAYING = null;
      const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const cur = () => TRACE[T];
      // NOT `top`: a top-level `const top` shadows window.top, which is
      // non-configurable, so the whole script is a SyntaxError before its first
      // statement runs. It parses; it just never executes. build.ps1 refuses the
      // four names this can happen with.
      const topFrame = (s) => s.frames[s.frames.length - 1];
      const cursorKey = (s) => (s.frames.length ? `${topFrame(s).nodeId}#${topFrame(s).pc}` : null);

      const blank = () => ({
        frames: [],
        status: 'running',
        result: undefined,
        error: null,
        unwinding: null,
        effects: [],
        errorLog: [],
        visited: {},
        errored: {},
        walked: {},
        move: null,
      });

      /** Apply one move. Bookkeeping only — see the rule above. */
      function apply(prev, m, i) {
        const s = structuredClone(prev);
        s.move = m;
        const f = topFrame(s);

        switch (m.k) {
          case 'enter':
            s.frames.push({ nodeId: m.node, pc: 0, site: null });
            s.visited[m.node] = (s.visited[m.node] || 0) + 1;
            break;
          case 'at':
            f.pc = m.at;
            break;
          case 'call': {
            f.pc = m.at;
            s.walked[f.nodeId + '>' + m.to] = true;
            s.frames.push({ nodeId: m.to, pc: 0, site: { node: f.nodeId, at: m.at } });
            s.visited[m.to] = (s.visited[m.to] || 0) + 1;
            break;
          }
          case 'effect':
            f.pc = m.at;
            s.effects.push({
              seq: s.effects.length + 1,
              node: f.nodeId,
              kind: m.kind,
              label: m.label,
              status: m.status,
              result: m.result,
              error: m.error,
              attempt: m.attempt || 1,
              at: i,
            });
            break;
          case 'raise':
            f.pc = m.at;
            s.error = { tag: m.tag, message: m.message, channel: m.channel, node: f.nodeId };
            s.unwinding = s.error;
            s.errored[f.nodeId] = true;
            s.errorLog.push({ at: i, kind: 'raised', ...s.error, where: f.nodeId });
            break;
          case 'handled':
            f.pc = m.at;
            s.errorLog.push({ at: i, kind: 'handled', ...(s.error || {}), where: f.nodeId, goto: m.goto });
            s.error = null;
            s.unwinding = null;
            break;
          case 'unwind': {
            const gone = s.frames.pop();
            s.errored[gone.nodeId] = true;
            s.errorLog.push({ at: i, kind: 'unwound', ...(s.unwinding || {}), where: gone.nodeId });
            if (gone.site) s.walked['!' + gone.site.node + '>' + gone.nodeId] = true;
            break;
          }
          case 'return':
            f.pc = m.at;
            s.lastReturn = { node: f.nodeId, value: m.value };
            s.frames.pop();
            break;
          case 'done':
            s.status = 'done';
            s.result = m.result;
            break;
          case 'uncaught':
            s.status = 'error';
            s.error = { tag: m.tag, message: m.message, channel: m.channel };
            s.unwinding = null;
            s.errorLog.push({ at: i, kind: 'uncaught', ...s.error, where: '—' });
            break;
        }
        return s;
      }

      function fold(walk) {
        const out = [blank()];
        walk.steps.forEach((m, i) => out.push(apply(out[out.length - 1], m, i)));
        return out;
      }

      function loadProgram(prog, presetIdx) {
        PROG = prepare(structuredClone(prog));
        PROG.presetIdx = presetIdx;
        PROG.input = structuredClone(prog.presets[presetIdx].input ?? {});
        const errs = validate(PROG);
        WALK = PROG.presets[presetIdx].walk;
        TRACE = WALK && !walkErrors(PROG, WALK).length ? fold(WALK) : [blank()];
        T = 0;
        SEL = null;
        PIN = null;
        stopPlay();
        layout();
        fit();
        render();
        return errs;
      }

      const stopHere = (i) => {
        const s = TRACE[i];
        if (s.status !== 'running') return true;
        const k = s.move?.k;
        if (OPT.breakError && (k === 'raise' || k === 'unwind')) return true;
        if (OPT.breakEffect && k === 'effect') return true;
        return BP.has(cursorKey(s));
      };

      /** Move the index. `extra` stops the run early — that is all Over and Out
       *  are now: a depth the recording already has.
       *
       *  A twenty-step Run must not start twenty stroke animations at once,
       *  which would be a light show rather than a gesture. Under the recording
       *  that costs nothing to avoid: the loop moves the subscript and draws
       *  only the transition it lands on. */
      function advance(extra) {
        const from = T;
        while (T < TRACE.length - 1) {
          T++;
          if (stopHere(T) || (extra && extra(TRACE[T]))) break;
        }
        SEL = null;
        if (T > from) traceMove(T, true);
        render();
      }

      function goTo(i, animate) {
        const next = Math.min(TRACE.length - 1, Math.max(0, i));
        if (next === T) return;
        const forward = next > T;
        // the move being played, or the move being undone: stepping back one
        // takes back the move at the index you are leaving, not the one you
        // land on
        const at = forward ? next : T;
        T = next;
        SEL = null;
        if (animate) traceMove(at, forward);
        render();
      }

      const actions = {
        restart() {
          stopPlay();
          goTo(0);
          render();
        },
        back: () => (stopPlay(), goTo(T - 1, true)),
        into: () => goTo(T + 1, true),
        over() {
          const d = cur().frames.length;
          advance((s) => s.frames.length <= d);
        },
        out() {
          const d = cur().frames.length;
          advance(d <= 1 ? () => false : (s) => s.frames.length < d);
        },
        cont: () => advance(null),
        play() {
          if (PLAYING) return (stopPlay(), render());
          PLAYING = setInterval(() => {
            if (T >= TRACE.length - 1) return (stopPlay(), render());
            goTo(T + 1, true);
          }, 480);
          render();
        },
        ir() {
          const d = document.getElementById('drawer');
          const open = d.dataset.open === '1';
          d.dataset.open = open ? '0' : '1';
          if (!open) {
            const { _labels, presetIdx, input, ...clean } = structuredClone(PROG);
            for (const n of Object.values(clean.nodes)) delete n.id;
            document.getElementById('irText').value = JSON.stringify(clean, null, 2);
          }
        },
        irLoad() {
          const box = document.getElementById('irErrors');
          try {
            const parsed = JSON.parse(document.getElementById('irText').value);
            if (!parsed.presets?.length)
              parsed.presets = [{ name: 'as loaded', blurb: '', input: parsed.input || {} }];
            // Validate a copy BEFORE swapping. Loading first and reporting after
            // leaves a program the page trips over sitting on the sheet, drawn
            // and steppable, which reads as accepted.
            const errs = validate(prepare(structuredClone(parsed)));
            box.textContent = errs.join(' · ');
            if (errs.length) return;
            loadProgram(parsed, 0);
            const at = PROGRAMS.findIndex((p) => p.id === parsed.id);
            at >= 0 ? (PROGRAMS[at] = parsed) : PROGRAMS.push(parsed);
            PI = at >= 0 ? at : PROGRAMS.length - 1;
            RI = 0;
            buildScenarios();
            actions.ir();
          } catch (e) {
            box.textContent = String(e);
          }
        },
      };

      function stopPlay() {
        if (PLAYING) clearInterval(PLAYING);
        PLAYING = null;
      }

      /* ======================================================================
         LAYOUT — layered, top to bottom. An assembly breakdown, not a blob.
         ==================================================================== */
      const W = 288;
      const GAP_X = 48;
      const GAP_Y = 96;
      const PAD = 36;
      let POS = {}; // nodeId -> {x, y, h}
      let EDGES = []; // {from, to, call, err}
      let FILES = []; // the program's file-tree diff
      let FILEMAP = {}; // path -> { touch: [nodeId], test: [nodeId] }
      let NOTICES = []; // structural findings, computed once per program

      /**
       * What the IR can be asked about itself, before a single step runs.
       *
       * All three come from the same place: a graph that names its files and its
       * channels can be checked against itself. None needs the VM.
       */
      function index() {
        FILES = PROG.files ?? [];
        FILEMAP = {};
        for (const f of FILES) FILEMAP[f.path] = { touch: [], test: [] };
        for (const [id, n] of Object.entries(PROG.nodes)) {
          for (const p of n.touches ?? []) (FILEMAP[p] ??= { touch: [], test: [] }).touch.push(id);
          for (const p of n.tests ?? []) (FILEMAP[p] ??= { touch: [], test: [] }).test.push(id);
        }

        NOTICES = [];

        // 1. One file, several nodes. On a map this is the parallelism question
        //    answered by arithmetic instead of by a warning nobody reads.
        for (const [path, rel] of Object.entries(FILEMAP)) {
          if (rel.touch.length > 1) {
            NOTICES.push({
              tag: 'shared',
              text: `${path} is edited by ${rel.touch.length} nodes — ${rel.touch.map((i) => PROG.nodes[i].name).join(', ')}`,
            });
          }
        }

        // 2. In the diff, on no node. The honest limit of a call graph: docs,
        //    gate rows and settings edits are real changes with no runtime node,
        //    and a graph that quietly omitted them would read as complete.
        const orphans = FILES.filter(
          (f) => !FILEMAP[f.path].touch.length && !FILEMAP[f.path].test.length,
        );
        if (orphans.length) {
          NOTICES.push({
            tag: 'unattached',
            text: `${orphans.length} of ${FILES.length} changed files are accounted for by no node on this sheet`,
          });
        }

        // 3. An E channel carrying a tag nothing beneath it can produce — the
        //    gist's layer-scoping rule, which says each layer catches what it
        //    received and renames it, so an implementation error from three
        //    layers down must never appear in a handler's E.
        for (const [id, n] of Object.entries(PROG.nodes)) {
          const own = new Set();
          for (const st of n.steps) {
            if (st.op === 'throw') own.add(st.tag);
            if (st.op === 'effect' && st.failWith) own.add(st.failWith.tag);
          }
          for (const c of calleesOf(id))
            for (const t of PROG.nodes[c].channels?.E ?? []) own.add(t);
          for (const t of n.channels?.E ?? []) {
            if (!own.has(t)) {
              NOTICES.push({
                tag: 'declared',
                text: `${n.name} declares ${t}, and nothing it calls or raises produces it`,
              });
            }
          }
        }
      }

      const calleesOf = (id) => {
        const out = [];
        for (const st of PROG.nodes[id].steps)
          if (st.op === 'call' && !out.includes(st.target)) out.push(st.target);
        return out;
      };

      function layout() {
        const ids = Object.keys(PROG.nodes);
        index();

        // depth = longest path from the entry, so a shared callee sinks below
        // every caller instead of cutting across them
        const depth = Object.fromEntries(ids.map((i) => [i, 0]));
        for (let k = 0; k < ids.length; k++)
          for (const id of ids)
            for (const c of calleesOf(id)) if (depth[c] < depth[id] + 1) depth[c] = depth[id] + 1;

        const order = [];
        const seen = new Set();
        (function dfs(id) {
          if (seen.has(id)) return;
          seen.add(id);
          order.push(id);
          calleesOf(id).forEach(dfs);
        })(PROG.entry);
        ids.forEach((id) => !seen.has(id) && order.push(id));

        const rows = {};
        for (const id of order) (rows[depth[id]] ||= []).push(id);

        // measure: every box is drawn at object weight so the geometry a
        // measurement produces is the geometry every later state uses. A
        // hidden canvas measures zero, so the tree view unhides it to measure
        // and puts it back — the drawing's geometry must not depend on which
        // view happened to be up when the program loaded.
        const canvasHidden = document.getElementById('canvas').hidden;
        document.getElementById('canvas').hidden = false;
        const host = document.getElementById('nodes');
        host.innerHTML = order
          .map(
            (id) =>
              `<div class="nd" data-node="${id}" style="left:0;top:0">${nodeInner(id, null)}</div>`,
          )
          .join('');
        const H = {};
        for (const el of host.children) H[el.dataset.node] = el.offsetHeight;

        const widest = Math.max(...Object.values(rows).map((r) => r.length));
        const sheetW = widest * W + (widest - 1) * GAP_X;

        POS = {};
        let y = PAD;
        for (const d of Object.keys(rows).sort((a, b) => a - b)) {
          const row = rows[d];
          const rowW = row.length * W + (row.length - 1) * GAP_X;
          let x = PAD + (sheetW - rowW) / 2;
          for (const id of row) {
            POS[id] = { x, y, h: H[id] };
            x += W + GAP_X;
          }
          y += Math.max(...row.map((id) => H[id])) + GAP_Y;
        }

        // corridors: the call runs down the left of the pair, the declared
        // error return runs up its right. Same corridor, opposite directions.
        EDGES = [];
        for (const from of ids)
          for (const to of calleesOf(from)) {
            const a = POS[from];
            const b = POS[to];
            const sx = a.x + W / 2 - 10;
            const sy = a.y + a.h;
            const ex = b.x + W / 2 - 10;
            const ey = b.y;
            const my = (sy + ey) / 2 - 6;
            const call = `M${sx},${sy} L${sx},${my} L${ex},${my} L${ex},${ey}`;
            const my2 = my + 12;
            const err = `M${ex + 20},${ey} L${ex + 20},${my2} L${sx + 20},${my2} L${sx + 20},${sy}`;
            EDGES.push({
              from,
              to,
              call,
              err,
              hasE: (PROG.nodes[to].channels?.E || []).length > 0,
            });
          }

        const canvas = document.getElementById('canvas');
        canvas.style.width = sheetW + PAD * 2 + 'px';
        canvas.style.height = y - GAP_Y + PAD + 'px';
        document
          .getElementById('wires')
          .setAttribute(
            'viewBox',
            `0 0 ${canvas.style.width.replace('px', '')} ${canvas.style.height.replace('px', '')}`,
          );
        document.getElementById('wires').style.width = canvas.style.width;
        document.getElementById('wires').style.height = canvas.style.height;
        canvas.hidden = canvasHidden;
      }

      /* ======================================================================
         RENDER
         ==================================================================== */
      const esc = (x) =>
        String(x).replace(
          /[&<>"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
        );
      function fmt(v, max = 70) {
        let out;
        try {
          out = JSON.stringify(v);
        } catch {
          out = String(v);
        }
        if (out === undefined) out = 'undefined';
        return out.length > max ? out.slice(0, max) + '…' : out;
      }

      function nodeState(s, id) {
        if (!s) return 'cold';
        if (s.frames.some((f) => f.nodeId === id)) return 'active';
        if (s.errored[id]) return 'error';
        if (s.visited[id]) return 'warm';
        return 'cold';
      }

      function firedTags(s, id) {
        return new Set((s?.errorLog || []).filter((l) => l.where === id).map((l) => l.tag));
      }

      function nodeInner(id, s) {
        const n = PROG.nodes[id];
        const ch = channelsOf(id);
        const st = nodeState(s, id);
        const fired = firedTags(s, id);

        const chip =
          st === 'error'
            ? '<span class="dw-state dw-state--caution">raised</span>'
            : st === 'warm'
              ? '<span class="dw-state dw-state--normal">returned</span>'
              : st === 'active'
                ? `<span class="dw-label">on stack${s.visited[id] > 1 ? ' · ' + s.visited[id] : ''}</span>`
                : '';

        const fx = n.steps
          .map((x, i) => [x, i])
          .filter(([x]) => x.op === 'effect')
          .map(([x]) => {
            const recs = (s?.effects || []).filter((r) => r.node === id && r.kind === x.kind);
            const cls = recs.some((r) => r.status === 'failed')
              ? 'fx--fail'
              : recs.length
                ? 'fx--ok'
                : '';
            const tries = recs.length > 1 ? ` ×${recs.length}` : '';
            return `<div class="fx ${cls}"><span class="fx-dot"></span><span class="fx-lead"></span>
              <span class="fx-txt">${esc(x.kind)}${tries} <span class="dim">${esc(x.desc || '')}</span></span></div>`;
          })
          .join('');

        const E = (ch.E || []).length
          ? ch.E.map((t) => `<span class="${fired.has(t) ? 'fired' : ''}">${esc(t)}</span>`).join(
              ' · ',
            )
          : '<span class="none">never</span>';

        return `
          <div class="nd-top">
            <button class="bp ${BP.has(id + '#0') ? 'bp--on' : ''}" data-bp="${id}#0" title="Hold on entry"></button>
            <span class="dw-label">${esc(n.kind)}</span>
            <span style="margin-left:auto">${chip}</span>
          </div>
          <div class="nd-name">${esc(n.name)}</div>
          <div class="nd-loc">${esc(n.loc || '')}</div>
          <div class="nd-ch">
            <b>A</b><span>${esc(ch.A || '—')}</span>
            <b>E</b><span>${E}</span>
            <b>R</b><span>${(ch.R || []).length ? esc(ch.R.join(', ')) : '<span class="none">none</span>'}</span>
          </div>
          ${fx}`;
      }

      function render() {
        const s = cur();
        VIEW === 'tree' ? renderTree(s) : renderPlan(s);
        renderCutaway(s);
        renderStack(s);
        renderScope(s);
        renderErrors(s);
        renderEffects(s);
        renderBlock(s);
        renderTools();
      }

      /* -- the R channel, per layer (#34) ----------------------------------
         A layer map is an OPTIONAL top-level block that renames R per node:

           "layers": { "tests": { "bindSheet": { "R": ["TextureLoader → stub"] } } }

         It substitutes an R token rather than a node, so a redraw needs no
         engine — which is the whole reason #34 could ship in version one. No
         program on this sheet declares one yet; the Layer row says so and
         disables itself rather than offering a switch that does nothing. */
      const layersIn = (prog) => Object.keys(prog?.layers ?? {});
      function channelsOf(id) {
        const base = PROG.nodes[id].channels || {};
        const over = PROG.layers?.[LAYER]?.[id];
        return over ? { ...base, ...over } : base;
      }

      /* -- the plan -------------------------------------------------------- */
      function renderPlan(s) {
        const host = document.getElementById('nodes');
        const selId = pinnedNode(s);
        host.innerHTML = Object.keys(PROG.nodes)
          .map((id) => {
            const p = POS[id];
            const st = nodeState(s, id);
            const cls = [
              'nd',
              st === 'cold' ? 'nd--cold' : '',
              st === 'error' ? 'nd--error' : '',
              st === 'active' ? 'nd--active' : '',
              id === selId ? 'nd--sel' : '',
            ]
              .filter(Boolean)
              .join(' ');
            return `<div class="${cls}" data-node="${id}"
                     style="left:${p.x}px;top:${p.y}px;height:${p.h}px">${nodeInner(id, s)}</div>`;
          })
          .join('');

        // the live caller→callee pairs, so the stack itself is drawn heavy
        const live = new Set();
        for (let i = 1; i < s.frames.length; i++)
          live.add(s.frames[i - 1].nodeId + '>' + s.frames[i].nodeId);
        const walked = s.walked || {};

        document.getElementById('edges').innerHTML = EDGES.map((e) => {
          const key = e.from + '>' + e.to;
          const onStack = live.has(key);
          const taken = walked[key];
          const errTaken = walked['!' + key];

          const w = onStack ? 2 : taken ? 1.5 : 1;
          const col = onStack || taken ? '#22262b' : 'rgb(34 38 43 / 0.3)';
          const mk = onStack || taken ? 'ar-ink' : 'ar-cold';

          let out = `<path d="${e.call}" fill="none" stroke="${col}" stroke-width="${w}" marker-end="url(#${mk})"/>`;
          if (e.hasE) {
            const ec = errTaken ? '#d97706' : 'rgb(34 38 43 / 0.3)';
            out += `<path d="${e.err}" fill="none" stroke="${ec}" stroke-width="${errTaken ? 1.5 : 1}"
                      stroke-dasharray="4 4" marker-end="url(#${errTaken ? 'ar-caut' : 'ar-cold'})"/>`;
          }
          return out;
        }).join('');
      }

      /* -- the tree, #35's `→` format --------------------------------------
         The same IR and the same walk as the drawing, which is what makes #35's
         claim visible rather than merely true: the written answer and the
         rendered page are one artifact seen twice.

         It walks call SITES, not nodes. bindSheet is called at two sites in
         buildShelf, so pr-313 is seven rows against six boxes — a truer picture
         of a call graph than the drawing gives, and the reason the two views
         are not the same list. */
      function callSites() {
        const rows = [];
        const walk = (id, depth, site, path) => {
          rows.push({ id, depth, site, cycle: path.includes(id) });
          if (path.includes(id) || depth > 12) return;
          for (const [i, st] of PROG.nodes[id].steps.entries())
            if (st.op === 'call' && PROG.nodes[st.target])
              // the label first: a jump label is the site's short name, and the
              // note is a sentence that would otherwise carry the whole row
              walk(st.target, depth + 1, { node: id, at: i, label: st.label || st.note || '' }, [
                ...path,
                id,
              ]);
        };
        walk(PROG.entry, 0, null, []);
        return rows;
      }

      /** A site is live if some frame was entered through exactly it. */
      const sameSite = (a, b) => a && b && a.node === b.node && a.at === b.at;

      function renderTree(s) {
        const taken = new Set();
        for (let i = 1; i <= T; i++) {
          const m = TRACE[i].move;
          if (m?.k === 'call') taken.add(topFrame(TRACE[i - 1]).nodeId + '#' + m.at);
        }
        const selId = pinnedNode(s);

        document.getElementById('tree').innerHTML = callSites()
          .map((r) => {
            const n = PROG.nodes[r.id];
            const ch = channelsOf(r.id);
            const live = s.frames.some((f) =>
              r.site ? sameSite(f.site, r.site) : f.nodeId === r.id && !f.site,
            );
            const reached = live || (r.site ? taken.has(r.site.node + '#' + r.site.at) : T > 0);
            const cls = ['tr', live ? 'tr--active' : '', reached ? '' : 'tr--cold', r.id === selId ? 'tr--sel' : '']
              .filter(Boolean)
              .join(' ');

            const E = (ch.E || []).length
              ? ch.E.map((t) => `<span class="${firedTags(s, r.id).has(t) ? 'fired' : ''}">${esc(t)}</span>`).join(' · ')
              : '<span class="none">never</span>';
            const R = (ch.R || []).length ? esc(ch.R.join(', ')) : '<span class="none">none</span>';

            const fx = n.steps
              .filter((x) => x.op === 'effect')
              .map((x) => {
                const recs = reached
                  ? s.effects.filter((e) => e.node === r.id && e.kind === x.kind)
                  : [];
                const mark = recs.some((e) => e.status === 'failed')
                  ? '<span class="caut">failed</span>'
                  : recs.length
                    ? '<span class="ok">landed</span>'
                    : '<span class="none">not reached</span>';
                return `<span class="tr-fx">· ${esc(x.kind)} ${mark}</span>`;
              })
              .join('');

            return `<div class="${cls}" data-node="${esc(r.id)}" style="margin-left:${r.depth * 24}px">
              <span class="tr-name">${r.depth ? '→ ' : ''}${esc(n.name)}${r.cycle ? ' <span class="dim">↺</span>' : ''}</span>
              <span class="dw-label tr-kind">${esc(n.kind)}</span>
              <span class="tr-ch"><b>A</b> ${esc(ch.A || '—')} &nbsp; <b>E</b> ${E} &nbsp; <b>R</b> ${R}</span>
              ${r.site?.label ? `<span class="tr-site dim" title="${esc(r.site.label)}">${esc(r.site.label)}</span>` : ''}
              ${fx ? `<span class="tr-fxs">${fx}</span>` : ''}
            </div>`;
          })
          .join('');
      }

      /* The one sanctioned gesture: a stroke that draws itself, reused for the
         only thing on this sheet that actually moves — control transferring. */
      function tracer(d, colour) {
        if (STILL) return;
        const g = document.getElementById('tracers');
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', d);
        p.setAttribute('fill', 'none');
        p.setAttribute('stroke', colour);
        p.setAttribute('stroke-width', '3');
        g.appendChild(p);
        const L = p.getTotalLength();
        p.style.strokeDasharray = L;
        p.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], {
          duration: 420,
          easing: 'cubic-bezier(.2,.7,.2,1)',
          fill: 'forwards',
        }).onfinish = () => {
          p.animate([{ opacity: 1 }, { opacity: 0 }], {
            duration: 280,
            fill: 'forwards',
          }).onfinish = () => p.remove();
        };
      }

      /* -- cutaway --------------------------------------------------------- */
      function pinnedNode(s) {
        if (PIN && PROG.nodes[PIN]) return PIN;
        const f = s.frames[SEL ?? s.frames.length - 1];
        return f ? f.nodeId : null;
      }

      function tapeLine(st) {
        const kw = (t) => `<span class="kw">${esc(t)}</span>`;
        const d = (t) => `<span class="dim">${esc(t)}</span>`;
        switch (st.op) {
          case 'note':
            return d('— ' + st.note);
          case 'let':
            return `${kw('let')} ${esc(st.name)} = ${esc(st.expr)}`;
          case 'if':
            return `${kw('if')} (${esc(st.cond)}) ${kw('goto')} ${esc(st.then)} ${kw('else')} ${esc(st.else)}`;
          case 'goto':
            return `${kw('goto')} ${esc(st.to)}`;
          case 'throw':
            return `${kw('throw')} ${esc(st.tag)} ${d('"' + st.message + '" · ' + st.channel)}`;
          case 'return':
            return `${kw('return')} ${esc(st.expr ?? '')}`;
          case 'effect': {
            const a = st.args ? st.args.replace(/^\(|\)$/g, '') : '';
            return `<span class="fx-dot" style="display:inline-block;vertical-align:middle"></span>
                    ${kw(st.kind)} ${esc(st.desc || '')} ${d(a.length > 46 ? a.slice(0, 46) + '…' : a)}${
                      st.bind ? ' → ' + esc(st.bind) : ''
                    }${st.failOnAttempt ? d('  fails on attempt ' + st.failOnAttempt.join(',')) : ''}`;
          }
          case 'call': {
            const args = Object.entries(st.args || {})
              .map(([k, e]) => `${k}: ${e}`)
              .join(', ');
            return `${st.bind ? kw('let') + ' ' + esc(st.bind) + ' = ' : ''}${kw('call')} ${esc(
              PROG.nodes[st.target].name,
            )}(${esc(args)})`;
          }
        }
        return esc(JSON.stringify(st));
      }

      function renderCutaway(s) {
        const id = pinnedNode(s);
        const cutName = document.getElementById('cutName');
        const tape = document.getElementById('tape');
        if (!id) {
          cutName.textContent = '—';
          document.getElementById('cutLoc').textContent = '';
          tape.innerHTML = `<div class="dw-annot">${
            s.status === 'error'
              ? 'Stack empty. ' + esc(s.error.tag) + ' — ' + esc(s.error.message)
              : 'Stack empty. Returned ' + esc(fmt(s.result, 200))
          }</div>`;
          return;
        }
        const n = PROG.nodes[id];
        cutName.textContent = n.name;
        document.getElementById('cutLoc').textContent = n.loc || '';

        const frameIdx = s.frames.findIndex((f) => f.nodeId === id);
        const f = frameIdx >= 0 ? s.frames[frameIdx] : null;
        document.getElementById('cutHint').textContent =
          TAB !== 'source' ? '' : f ? `pc ${f.pc}` : 'not on the stack — showing the plan only';

        if (TAB === 'files') return void (tape.innerHTML = filesView(id));
        if (TAB === 'contract') return void (tape.innerHTML = contractView(id));

        tape.innerHTML = n.steps
          .map((st, i) => {
            const here = f && i === f.pc;
            const past = f && i < f.pc;
            const key = `${id}#${i}`;
            return `<div class="tp ${here ? 'tp--here' : past ? 'tp--past' : ''}">
              <button class="bp ${BP.has(key) ? 'bp--on' : ''}" data-bp="${key}" title="Hold here"></button>
              <span class="tp-n dw-num">${i}</span>
              <span class="tp-lbl">${st.label ? esc(st.label) : ''}</span>
              <span class="tp-src">${tapeLine(st)}${
                st.note && st.op !== 'note' ? `<div class="dim">— ${esc(st.note)}</div>` : ''
              }${
                (st.onError || [])
                  .map((h) => `<div class="dim">↳ catch ${esc(h.tag)} → ${esc(h.goto)}</div>`)
                  .join('') || ''
              }</span>
            </div>`;
          })
          .join('');
        const active = tape.querySelector('.tp--here');
        if (active) active.scrollIntoView({ block: 'nearest' });
      }

      /* -- the file-tree diff, wsff.md's second Program Design artifact ----- */
      const CHANGE = { new: 'new', edit: 'edit', delete: 'del' };

      function fileRow(f, selected) {
        const rel = FILEMAP[f.path] ?? { touch: [], test: [] };
        const shared = rel.touch.length > 1;
        const cut = f.path.lastIndexOf('/');
        const dir = cut < 0 ? '' : f.path.slice(0, cut + 1);
        const base = cut < 0 ? f.path : f.path.slice(cut + 1);
        const n = [f.adds ? `+${f.adds}` : '', f.dels ? `−${f.dels}` : '']
          .filter(Boolean)
          .join(' ');
        return `<div class="frow ${shared ? 'frow--shared' : ''}">
            <span class="fchange">${esc(CHANGE[f.change] ?? f.change ?? '')}</span>
            <span class="fpath"><span class="fdir">${esc(dir)}</span>${
              selected ? `<b>${esc(base)}</b>` : esc(base)
            }</span>
            <span class="fnum">${esc(n)}</span>
            ${f.why ? `<span class="fwhy">${esc(f.why)}</span>` : ''}
          </div>`;
      }

      function filesView(id) {
        if (!FILES.length)
          return '<div class="dw-annot">This program declares no file-tree diff. Add a top-level <code>files</code> list and per-node <code>touches</code> / <code>tests</code>.</div>';

        const mine = new Set([...(PROG.nodes[id].touches ?? []), ...(PROG.nodes[id].tests ?? [])]);
        const rel = (p) => FILEMAP[p] ?? { touch: [], test: [] };
        const groups = [
          {
            label: `This node — ${PROG.nodes[id].name}`,
            rows: FILES.filter((f) => mine.has(f.path)),
          },
          {
            label: 'Other nodes on this sheet',
            rows: FILES.filter(
              (f) => !mine.has(f.path) && (rel(f.path).touch.length || rel(f.path).test.length),
            ),
          },
          {
            label: 'In the diff, on no node',
            rows: FILES.filter((f) => !rel(f.path).touch.length && !rel(f.path).test.length),
          },
        ];

        const notices = NOTICES.filter((x) => x.tag !== 'declared');
        return (
          groups
            .filter((g) => g.rows.length)
            .map(
              (g) =>
                `<div class="fgroup"><span class="dw-label">${esc(g.label)} · ${g.rows.length}</span>
                 ${g.rows.map((f) => fileRow(f, mine.has(f.path))).join('')}</div>`,
            )
            .join('') +
          (notices.length
            ? `<div class="fgroup"><span class="dw-label">Notices</span>${notices
                .map((x) => `<div class="dw-annot caut">${esc(x.text)}</div>`)
                .join('')}</div>`
            : '')
        );
      }

      /* -- the contract: type signatures, the third artifact ---------------- */
      const CARD = {
        one: 'one value, then done',
        many: 'many values over time',
        window: 'valid for a window — cache it',
      };

      function contractView(id) {
        const n = PROG.nodes[id];
        const ch = n.channels ?? {};
        const fx = [...new Set(n.steps.filter((s) => s.op === 'effect').map((s) => s.kind))];
        const raises = [
          ...new Set([
            ...n.steps.filter((s) => s.op === 'throw').map((s) => s.tag),
            ...n.steps.filter((s) => s.op === 'effect' && s.failWith).map((s) => s.failWith.tag),
          ]),
        ];
        const leaks = NOTICES.filter(
          (x) => x.tag === 'declared' && x.text.startsWith(n.name + ' '),
        );

        const cell = (k, v) =>
          `<div class="dw-titleblock-cell"><span class="dw-titleblock-key">${esc(k)}</span>
           <span class="dw-titleblock-val">${v}</span></div>`;
        const or = (x, fallback) =>
          x && x.length ? esc(x) : `<span class="none">${fallback}</span>`;

        return `<div class="contract dw-titleblock" style="grid-template-columns:repeat(auto-fit,minmax(13rem,1fr))">
            ${cell('Kind', esc(n.kind))}
            ${cell('Cardinality', esc(CARD[n.card ?? 'one']))}
            ${cell('Declared at', esc(n.loc ?? '—'))}
            ${cell('Parameters', or((n.params ?? []).join(', '), 'none'))}
            ${cell('A — success', or(ch.A, '—'))}
            ${cell('E — failure', or((ch.E ?? []).join(' · '), 'never'))}
            ${cell('R — requires', or((ch.R ?? []).join(', '), 'nothing'))}
            ${cell('Effects performed', or(fx.join(', '), 'none'))}
            ${cell('Raises here', or(raises.join(' · '), 'nothing'))}
            ${cell('Asserted by', or((n.tests ?? []).join(', '), 'nothing on this sheet'))}
          </div>
          ${
            leaks.length
              ? `<div style="padding:var(--dw-s2) var(--dw-s3)">${leaks
                  .map((x) => `<div class="dw-annot caut">${esc(x.text)}</div>`)
                  .join('')}</div>`
              : ''
          }`;
      }

      /* -- side ------------------------------------------------------------ */
      function renderStack(s) {
        const sel = SEL ?? s.frames.length - 1;
        document.getElementById('stack').innerHTML =
          s.frames
            .map((f, i) => {
              const n = PROG.nodes[f.nodeId];
              return `<button class="frame ${i === s.frames.length - 1 ? 'frame--top' : ''} ${
                i === sel ? 'frame--sel' : ''
              }" data-frame="${i}">${esc(n.name)}
                <span class="dw-annot dw-num" style="display:block">${esc(n.loc || '')} · pc ${f.pc}</span>
              </button>`;
            })
            .reverse()
            .join('') || '<div class="dw-annot">empty</div>';
      }

      /* Scope-at-a-frame becomes inputs-for-the-walk. The block survives — the
         owner named seeing a system's inputs as the valuable part — but its
         fields drove FORKING, and a fork computes a state nothing recorded. A
         field that looks editable and is not is worse than a value that never
         looked editable, so the border and the caret go and the whole preset
         input block is shown instead, fault included. (#33, detail A.) */
      function renderScope() {
        const rows = Object.entries(PROG.input ?? {});
        document.getElementById('scope').innerHTML =
          rows
            .map(
              ([k, v]) => `<div class="var"><span class="var-k">${esc(k)}</span>
              <span class="row-v${/fail|missing|error|404/i.test(k) ? ' caut' : ''}">${esc(fmt(v, 200))}</span></div>`,
            )
            .join('') || '<div class="dw-annot">this preset sets no input</div>';
      }

      const MARK = {
        raised: 'raised in',
        unwound: 'unwound past',
        handled: 'handled by',
        uncaught: 'escaped the sheet',
      };

      function renderErrors(s) {
        const box = document.getElementById('errors');
        const live = s.unwinding || (s.error && s.status !== 'done' ? s.error : null);
        const head = live
          ? `<div class="row"><span class="caut" style="font-weight:600">${esc(live.tag)}</span>
             <span class="dw-annot">${esc(live.channel)}</span></div>
             <div class="dw-annot">${esc(live.message)}</div>`
          : `<div class="dw-annot">${s.errorLog.length ? 'nothing in flight' : 'clean'}</div>`;

        const log = s.errorLog
          .map(
            (l) => `<div class="row" style="margin-top:2px">
            <span class="dw-annot dw-num" style="width:1.6rem;text-align:right">${l.at}</span>
            <span class="${l.kind === 'handled' ? 'ok' : 'caut'}" style="font-size:var(--dw-t-micro)">${MARK[l.kind]}</span>
            <span class="row-v dw-annot">${esc(PROG.nodes[l.where]?.name ?? l.where)}${
              l.goto ? ' → ' + esc(l.goto) : ''
            }</span>
          </div>`,
          )
          .join('');

        box.innerHTML =
          head + (log ? `<hr class="dw-rule" style="margin:var(--dw-s1) 0" />${log}` : '');
      }

      function renderEffects(s) {
        document.getElementById('effects').innerHTML =
          s.effects
            .slice()
            .reverse()
            .map(
              (r) => `<div class="led">
            <span class="led-seq dw-num">${r.seq}</span>
            <span class="led-body">
              <div><span class="${r.status === 'ok' ? 'ok' : 'caut'}">${esc(r.kind)}</span>${
                r.attempt > 1 ? ` <span class="dw-annot">try ${r.attempt}</span>` : ''
              }</div>
              <div class="dim">${esc(r.label)}</div>
              <div class="dim">${r.status === 'ok' ? '→ ' + esc(fmt(r.result, 44)) : '✕ ' + esc(r.error.tag)}</div>
            </span>
          </div>`,
            )
            .join('') || '<div class="dw-annot">nothing has touched the world yet</div>';
      }

      function renderBlock(s) {
        document.getElementById('tbProgram').textContent = PROG.title;
        document.getElementById('tbPreset').textContent = PROG.presets[PROG.presetIdx].name;
        document.getElementById('tbStep').textContent = `${T} / ${TRACE.length - 1}`;
        const st =
          s.status === 'error'
            ? `<span class="dw-state dw-state--caution">uncaught ${esc(s.error.tag)}</span>`
            : s.status === 'done'
              ? '<span class="dw-state dw-state--normal">returned</span>'
              : PLAYING
                ? '<span class="dw-state dw-state--normal">auto</span>'
                : '<span class="dw-label">holding</span>';
        document.getElementById('tbStatus').innerHTML = st;

        // Amber on a bordered stamp for an authored walk, green for a captured
        // one: green is nominal, and a walk a real run produced is the nominal
        // case. This is one of the few places it earns a use.
        const p = WALK?.provenance;
        document.getElementById('tbWalk').innerHTML =
          `<span>walk ${
            p === 'captured'
              ? '<span class="dw-state dw-state--normal">captured</span>'
              : p === 'authored'
                ? `<span class="stamp" title="${esc(WALK.recordedBy ?? '')}">authored</span>`
                : '<span class="stamp">none recorded</span>'
          }</span>`;

        document.getElementById('tbNotices').innerHTML = NOTICES.length
          ? `<span class="dw-state dw-state--caution">${NOTICES.length}</span>`
          : '<span class="dw-label">none</span>';

        renderSheetFacts();

        const last = TRACE.length - 1;
        document.getElementById('dimB').textContent = last;
        const pct = last ? (T / last) * 100 : 0;
        document.getElementById('dimTick').style.left = pct + '%';
        document.getElementById('dimFill').style.width = pct + '%';
      }

      /* -- the footer band: #31's per-sheet facts --------------------------
         Only two, not three. filesView() already carries "in the diff, on no
         node" as one of its three groups — #31's first deliverable shipped
         before the ticket that placed it. What had no home is the graphs this
         run found and did not draw, and the scope rule it applied. Both read
         off an optional top-level `sheet` block; the file count is derived. */
      function renderSheetFacts() {
        const orphans = FILES.filter(
          (f) => !FILEMAP[f.path].touch.length && !FILEMAP[f.path].test.length,
        ).length;
        const other = PROG.sheet?.graphsNotDrawn ?? [];
        const parts = [];
        if (FILES.length)
          parts.push(`<span><b class="dw-num">${orphans}/${FILES.length}</b> files on no node</span>`);
        if (other.length)
          parts.push(
            `<span><b class="dw-num">${other.length}</b> graph${other.length > 1 ? 's' : ''} not drawn — ${esc(other.join(', '))}</span>`,
          );
        if (PROG.sheet?.scopeRule) parts.push(`<span>scope: ${esc(PROG.sheet.scopeRule)}</span>`);
        document.getElementById('sheetfacts').innerHTML = parts.join('');
      }

      /* -- the tool block --------------------------------------------------- */
      function renderTools() {
        const set = (sel, on, off) => {
          for (const b of document.querySelectorAll(sel)) {
            b.classList.toggle('on', on(b));
            off(b) ? b.setAttribute('disabled', '') : b.removeAttribute('disabled');
          }
        };
        // Zoom has nothing to act on in tree mode, so the whole row greys out.
        set('[data-zoom]', () => false, () => VIEW === 'tree');
        document.getElementById('scaleNow').textContent = VIEW === 'tree' ? '—' : SCALE;

        const has = layersIn(PROG);
        set(
          '[data-layer]',
          (b) => b.dataset.layer === LAYER,
          (b) => b.dataset.layer !== 'production' && !has.includes(b.dataset.layer),
        );
        document.querySelector('[data-layer="tests"]').title = has.includes('tests')
          ? 'Substitute the tests layer’s R'
          : 'This program declares no layer map — see #34';

        set('[data-view]', (b) => b.dataset.view === VIEW, () => false);
      }

      /* ======================================================================
         WIRING
         ==================================================================== */
      let PI = 0;
      let RI = 0;

      function buildScenarios() {
        document.getElementById('scenario').innerHTML = PROGRAMS.map((p, pi) =>
          p.presets
            .map(
              (pr, ri) => `<option value="${pi}:${ri}">${esc(p.title)} · ${esc(pr.name)}</option>`,
            )
            .join(''),
        ).join('');
        document.getElementById('scenario').value = `${PI}:${RI}`;
      }

      document.getElementById('scenario').addEventListener('change', (e) => {
        [PI, RI] = e.target.value.split(':').map(Number);
        loadProgram(PROGRAMS[PI], RI);
      });

      /* ======================================================================
         VIEWPORT — the drawing pans and zooms; the paper does not.

         The grid stays on .plan rather than on the canvas, so what moves is the
         drawing over the sheet, which is the light-table reading and keeps the
         grid pitch honest at every zoom.
         ==================================================================== */
      const K_MIN = 0.2;
      const K_MAX = 2.5;
      let K = 1;
      let TX = 0;
      let TY = 0;

      const plan = document.getElementById('plan');
      const canvasEl = document.getElementById('canvas');

      let SCALE = '1:1'; // the drawing's own scale, in ratio notation
      function applyView() {
        canvasEl.style.transform = `translate(${TX}px, ${TY}px) scale(${K})`;
        SCALE =
          K >= 0.999 && K <= 1.001 ? '1:1' : K > 1 ? `${K.toFixed(2)}:1` : `1:${(1 / K).toFixed(2)}`;
        if (VIEW !== 'tree') document.getElementById('scaleNow').textContent = SCALE;
      }

      /** Zoom about a point in the pane, so what is under the cursor stays put. */
      function zoomAt(px, py, next) {
        const k2 = Math.min(K_MAX, Math.max(K_MIN, next));
        TX = px - ((px - TX) * k2) / K;
        TY = py - ((py - TY) * k2) / K;
        K = k2;
        applyView();
      }

      function fit() {
        const w = canvasEl.offsetWidth;
        const h = canvasEl.offsetHeight;
        const r = plan.getBoundingClientRect();
        if (!w || !h || !r.width) return;
        K = Math.min(K_MAX, Math.max(K_MIN, Math.min((r.width - 24) / w, (r.height - 24) / h, 1)));
        TX = (r.width - w * K) / 2;
        TY = 12;
        applyView();
      }

      plan.addEventListener(
        'wheel',
        (e) => {
          e.preventDefault();
          const r = plan.getBoundingClientRect();
          zoomAt(e.clientX - r.left, e.clientY - r.top, K * Math.exp(-e.deltaY * 0.0015));
        },
        { passive: false },
      );

      // Drag to pan. A press that never travels 4px is still a click, so
      // selecting a node and dragging the sheet share one gesture.
      let DRAGGED = false;
      plan.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || e.target.closest('.toolblock, .tree')) return;
        const x0 = e.clientX;
        const y0 = e.clientY;
        const tx0 = TX;
        const ty0 = TY;
        DRAGGED = false;
        const move = (ev) => {
          if (!DRAGGED && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 4) return;
          if (!DRAGGED) {
            DRAGGED = true;
            plan.dataset.panning = '1';
          }
          TX = tx0 + (ev.clientX - x0);
          TY = ty0 + (ev.clientY - y0);
          applyView();
        };
        const up = () => {
          removeEventListener('pointermove', move);
          removeEventListener('pointerup', up);
          delete plan.dataset.panning;
        };
        addEventListener('pointermove', move);
        addEventListener('pointerup', up);
      });

      document.getElementById('toolblock').addEventListener('click', (e) => {
        const v = e.target.closest('[data-view]');
        if (v) {
          VIEW = v.dataset.view;
          document.getElementById('tree').hidden = VIEW !== 'tree';
          canvasEl.hidden = VIEW === 'tree';
          if (VIEW !== 'tree') fit();
          return render();
        }
        const l = e.target.closest('[data-layer]:not([disabled])');
        if (l) {
          LAYER = l.dataset.layer;
          // An R token is substituted, not a node, so the geometry is unchanged
          // and the redraw needs nothing computed. That is #34's whole case.
          return render();
        }
        const b = e.target.closest('[data-zoom]:not([disabled])');
        if (!b) return;
        const r = plan.getBoundingClientRect();
        const how = b.dataset.zoom;
        if (how === 'fit') return fit();
        if (how === 'one') return zoomAt(r.width / 2, r.height / 2, 1);
        zoomAt(r.width / 2, r.height / 2, K * (how === 'in' ? 1.25 : 0.8));
      });

      /* -- the two splitters ------------------------------------------------ */
      function splitter(el, axis, prop, min, max, pane) {
        el.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          const root = document.querySelector('.sheet-root');
          const start = axis === 'x' ? e.clientX : e.clientY;
          // Measure the pane rather than parsing the custom property: its
          // initial value is `22rem`, and parseFloat of that is 22.
          const box = document.querySelector(pane).getBoundingClientRect();
          const from = axis === 'x' ? box.width : box.height;
          root.dataset.resizing = '1';
          const move = (ev) => {
            const d = (axis === 'x' ? ev.clientX : ev.clientY) - start;
            // both panes grow as the pointer moves toward the sheet's interior
            const px = Math.min(max(), Math.max(min, from - d));
            root.style.setProperty(prop, px + 'px');
          };
          const up = () => {
            removeEventListener('pointermove', move);
            removeEventListener('pointerup', up);
            delete root.dataset.resizing;
            fit();
          };
          addEventListener('pointermove', move);
          addEventListener('pointerup', up);
        });
      }
      splitter(
        document.getElementById('vsp'),
        'x',
        '--side-w',
        220,
        () => innerWidth * 0.6,
        '.side',
      );
      splitter(document.getElementById('hsp'), 'y', '--cut-h', 80, () => innerHeight * 0.7, '.cut');
      addEventListener('resize', fit);

      document.body.addEventListener('click', (e) => {
        // a pan that ended over a node is not a click on it
        if (DRAGGED) return void (DRAGGED = false);
        const bp = e.target.closest('[data-bp]');
        if (bp) {
          e.stopPropagation();
          const k = bp.dataset.bp;
          BP.has(k) ? BP.delete(k) : BP.add(k);
          return render();
        }
        const act = e.target.closest('[data-act]');
        if (act) return actions[act.dataset.act]();
        const fr = e.target.closest('[data-frame]');
        if (fr) {
          SEL = Number(fr.dataset.frame);
          PIN = null;
          return render();
        }
        const tb = e.target.closest('[data-tab]');
        if (tb) {
          TAB = tb.dataset.tab;
          for (const b of document.querySelectorAll('[data-tab]'))
            b.classList.toggle('tab--on', b.dataset.tab === TAB);
          return render();
        }
        const nd = e.target.closest('[data-node]');
        if (nd) {
          PIN = PIN === nd.dataset.node ? null : nd.dataset.node;
          return render();
        }
      });

      document
        .getElementById('brkEffect')
        .addEventListener('change', (e) => (OPT.breakEffect = e.target.checked));
      document
        .getElementById('brkError')
        .addEventListener('change', (e) => (OPT.breakError = e.target.checked));

      // the dimension line seeks
      (function () {
        const dim = document.getElementById('dim');
        const span = dim.querySelector('.trace-span');
        let down = false;
        const seek = (ev) => {
          const r = span.getBoundingClientRect();
          const p = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
          stopPlay();
          goTo(Math.round(p * (TRACE.length - 1)));
        };
        dim.addEventListener('pointerdown', (e) => {
          down = true;
          // Seek first. setPointerCapture throws for a pointerId that is not
          // active — which swallowed the seek entirely until it was moved below.
          seek(e);
          try {
            span.setPointerCapture(e.pointerId);
          } catch {
            /* drag still works off the window-level pointerup */
          }
        });
        dim.addEventListener('pointermove', (e) => down && seek(e));
        addEventListener('pointerup', () => (down = false));
      })();

      addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowRight') actions.into();
        if (e.key === 'ArrowLeft') actions.back();
        if (e.key === 'F8') (e.preventDefault(), actions.cont());
        if (e.key === 'F10') (e.preventDefault(), actions.over());
        if (e.key === 'F11') (e.preventDefault(), actions.out());
      });

      /* Draw the tracer for whatever the move at the new index did. Control
         transferring is the only thing on this sheet that actually moves, and
         an untravelled corridor stays a construction line — which is the whole
         honesty claim of the drawing, and the reason a walk is worth stepping
         at all rather than reading as a finished picture.

         Under the recording this reads the move rather than diffing two states,
         so a step backwards can draw the same stroke in reverse. */
      function traceMove(at, forward) {
        const m = TRACE[at]?.move;
        const before = TRACE[at - 1]; // the state the move acted on, either way
        if (!m || !before) return;
        // Taking a move back draws its own stroke the other way. Only a
        // recording can do that: the VM could step forward and no further.
        const draw = (d, colour) => tracer(forward ? d : reverse(d), colour);

        if (m.k === 'call') {
          const e = EDGES.find((x) => x.from === topFrame(before)?.nodeId && x.to === m.to);
          if (e) draw(e.call, '#22262b');
          return;
        }
        if (m.k === 'return' || m.k === 'unwind') {
          const gone = topFrame(before);
          const caller = before.frames[before.frames.length - 2];
          if (!gone || !caller) return;
          const e = EDGES.find((x) => x.from === caller.nodeId && x.to === gone.nodeId);
          if (!e) return;
          const err = m.k === 'unwind';
          draw(err ? e.err : reverse(e.call), err ? '#d97706' : '#15803d');
        }
      }

      /** Reverse a polyline `d` so a return draws upward, the way it travels. */
      function reverse(d) {
        const pts = d
          .slice(1)
          .split(/[ML]/)
          .map((p) => p.trim())
          .filter(Boolean)
          .reverse();
        return 'M' + pts.join(' L');
      }

      buildScenarios();
      loadProgram(PROGRAMS[0], 0);
    </script>
  </body>
</html>
