<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D-01 · Call graph sheet</title>

    <!--
      ==========================================================================
      PROTOTYPE — throwaway. Sheet D-01.

      Answers: "what does the call graph look like as a drawing, and does the
      drawing stay honest while you step it?"

      SOURCE FILE. This is the template, not the deliverable.
      Run build.ps1 to splice in the fonts, drafting.css and the programs and
      produce index.html — one self-contained file, no network at all.

      THERE IS NO ENGINE HERE. #28 was amended to "the artifact steps over a
      recorded walk", so nothing on this page computes a next state: each
      program carries its walk as data, and this file plays it. The VM did not
      die, it moved to record time — record.mjs lifts it out of D-00, runs it
      once offline and writes the tape into the IR. The IR is the product; a
      viewer is a view; the walk is a claim the viewer only replays.

      DESIGN: Drafting / Aviation. Four colours, and two of them are budgets.
        ink        structure. Line weight is the depth system: 1px construction,
                   1.5px leader/dimension, 2px object outline.
        caution    attention required — a fired error, a failed effect, a
                   breakpoint. Never a declared one. A `throw` in the source is
                   code; a throw that happened is a caution.
        normal     nominal — a frame that returned, an effect that landed.
        No radius, no shadow, no gradient, no icon set, no emoji. Drawing
        notation carries what icons would: leader lines with terminal dots,
        witness ticks, dimension arrowheads, a dashed cutaway, a title block.
      ==========================================================================
    -->

    <style>
      /* __FONTS__ */
    </style>
    <style>
      /* __DRAFTING__ */
    </style>

    <style>
      /* ======================================================================
         SHEET LAYOUT — this prototype only. Tokens only, no new values.
         ==================================================================== */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
      }

      /* Two zero-width tracks hold the splitters, so each one spans exactly the
         panes it divides — not the header, not the title block. The hit area is
         a ::after that overflows the track; the visible rule stays 2px. */
      /* --cut-h is 12rem because that is where the splitter wants to sit, and
         it is a measured answer rather than a taste. The fit is height-bound in
         every configuration, so the cutaway is the only thing throttling the
         drawing — but under #28's amendment the tape is where the walk is READ,
         so height given back to the drawing is taken from the thing stepping
         exists to show. Measured at 1440 × 900, on pr-313's ten-step entry and
         its five-step callee:

           8rem  1:1.38   3/10 rows   3/5 rows
           10rem 1:1.46   4/10        3/5     <- #33 delta 2 proposed this
           12rem 1:1.55   6/10        5/5     <- the knee
           15rem 1:1.71   7/10        5/5     <- as built
           18rem 1:1.91   9/10        5/5
           22rem 1:2.26  10/10        5/5

         12rem is the smallest cut that still shows a small node's whole tape,
         and it buys 10% more drawing than 15rem. 10rem clips a five-step node,
         which is the trade the amendment says not to make. */
      .sheet-root {
        --side-w: 22rem;
        --cut-h: 12rem;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 0 var(--side-w);
        grid-template-rows: auto 1fr 0 var(--cut-h) auto;
        grid-template-areas:
          'head  head head'
          'plan  vsp  side'
          'hsp   vsp  side'
          'cut   vsp  side'
          'block block block';
      }
      .vsp,
      .hsp {
        position: relative;
        z-index: 5;
      }
      .vsp {
        grid-area: vsp;
      }
      .hsp {
        grid-area: hsp;
      }
      .vsp::after,
      .hsp::after {
        content: '';
        position: absolute;
      }
      .vsp::after {
        inset: 0 -5px;
        cursor: col-resize;
      }
      .hsp::after {
        inset: -5px 0;
        cursor: row-resize;
      }
      /* Dragging one is a measurement, so it reads as a dimension line would. */
      .sheet-root[data-resizing] {
        user-select: none;
      }
      .sheet-root[data-resizing] .vsp::after,
      .sheet-root[data-resizing] .hsp::after {
        background: var(--dw-caution);
      }

      /* -- header ---------------------------------------------------------- */
      .head {
        grid-area: head;
        display: flex;
        align-items: center;
        gap: var(--dw-s3);
        padding: var(--dw-s2) var(--dw-s3);
        border-bottom: var(--dw-rule-bold) solid var(--dw-ink);
        flex-wrap: wrap;
      }
      .head-id {
        display: flex;
        align-items: baseline;
        gap: var(--dw-s2);
      }

      select,
      button,
      input {
        font: inherit;
        font-size: var(--dw-t-micro);
        color: var(--dw-ink);
        background: var(--dw-paper);
        border: var(--dw-rule-hair) solid var(--dw-ink-30);
        border-radius: 0;
        padding: 4px var(--dw-s2);
      }
      select {
        font-size: var(--dw-t-annot);
        border-color: var(--dw-ink);
        border-width: var(--dw-rule-thin);
        max-width: 22rem;
      }
      .btn {
        text-transform: uppercase;
        letter-spacing: var(--dw-track-label);
        font-weight: 500;
        cursor: pointer;
        transition:
          color 150ms,
          border-color 150ms;
      }
      .btn:hover {
        border-color: var(--dw-ink);
      }
      .btn[disabled] {
        color: var(--dw-ink-30);
        border-color: var(--dw-ink-12);
        cursor: default;
      }
      .btn--run {
        border-color: var(--dw-ink);
        border-width: var(--dw-rule-thin);
      }
      .btn-group {
        display: flex;
        gap: var(--dw-s1);
        margin-left: auto;
      }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: var(--dw-s1);
        font-size: var(--dw-t-micro);
        text-transform: uppercase;
        letter-spacing: var(--dw-track-label);
        color: var(--dw-ink-55);
        cursor: pointer;
      }
      /* A checkbox is not drawing notation. This is a witness tick that fills. */
      .toggle input {
        appearance: none;
        width: 10px;
        height: 10px;
        padding: 0;
        border: var(--dw-rule-hair) solid var(--dw-ink-30);
      }
      .toggle input:checked {
        background: var(--dw-caution);
        border-color: var(--dw-caution);
      }

      /* -- the plan (graph) ------------------------------------------------ */
      .plan {
        grid-area: plan;
        overflow: hidden;
        position: relative;
        border-right: var(--dw-rule-bold) solid var(--dw-ink);
        cursor: grab;
        touch-action: none;
      }
      .plan[data-panning] {
        cursor: grabbing;
      }
      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
        padding: var(--dw-s4);
      }

      /* The tool block, on the drawing rather than in the title block. One rule
         sorts every control on this sheet: the HEAD drives the walk, the tool
         block changes how the sheet is READ and never touches it. Zoom was
         always here — a wheel can change it at any moment, and a title-block
         cell states a fact rather than tracking one. Layer and view track the
         same way, so they join it. (#33, delta 3.)

         One row per tool, with a fixed key column, so the rows read as a table
         of controls rather than three ragged strips. */
      .toolblock {
        position: absolute;
        top: var(--dw-s2);
        right: var(--dw-s2);
        z-index: 4;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        background: var(--dw-paper);
        border: var(--dw-rule-thin) solid var(--dw-ink);
      }
      .toolblock .grp {
        display: flex;
        align-items: stretch;
      }
      .toolblock .grp + .grp {
        border-top: var(--dw-rule-hair) solid var(--dw-ink-30);
      }
      .toolblock .grp-k {
        width: 4.5rem;
        flex: none;
        text-align: left;
        align-self: center;
        padding: 3px var(--dw-s2);
        font-size: var(--dw-t-micro);
        text-transform: uppercase;
        letter-spacing: var(--dw-track-label);
        color: var(--dw-ink-30);
        border-right: var(--dw-rule-hair) solid var(--dw-ink-12);
      }
      .toolblock button {
        border: 0;
        border-left: var(--dw-rule-hair) solid var(--dw-ink-12);
        border-bottom: var(--dw-rule-bold) solid transparent;
        background: transparent;
        padding: 3px var(--dw-s2);
        font-size: var(--dw-t-micro);
        text-transform: uppercase;
        letter-spacing: var(--dw-track-label);
        color: var(--dw-ink-55);
        cursor: pointer;
        transition: color 150ms;
      }
      .toolblock .grp button:first-of-type {
        border-left: 0;
      }
      .toolblock button:hover {
        color: var(--dw-ink);
      }
      /* The live tool takes .tab--on's treatment — ink label, 2px bottom rule.
         Not a filled chip; this sheet uses one nowhere. */
      .toolblock button.on {
        color: var(--dw-ink);
        border-bottom-color: var(--dw-ink);
      }
      .toolblock button[disabled] {
        color: var(--dw-ink-30);
        cursor: default;
      }
      .toolblock .now {
        padding: 3px var(--dw-s2);
        font-size: var(--dw-t-micro);
        letter-spacing: var(--dw-track-label);
        font-variant-numeric: tabular-nums;
        align-self: center;
        min-width: 4.5rem;
        text-align: center;
        border-left: var(--dw-rule-hair) solid var(--dw-ink-12);
      }

      /* The tree rendering, in #35's `→` format. Same IR, same walk, so the
         drawing and the tree are one artifact seen twice — and the tree walks
         call SITES where the drawing draws NODES, so a callee reached from two
         places appears twice. */
      .tree {
        position: absolute;
        inset: 0;
        padding: var(--dw-s4) var(--dw-s3);
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      /* Paper under every row: the plan carries .dw-grid, and 11px annotation
         over a 24px grid pitch is the one place the grid stops being
         background. */
      .tr {
        display: flex;
        align-items: baseline;
        gap: var(--dw-s2);
        padding: 5px var(--dw-s2);
        background: var(--dw-paper);
        font-size: var(--dw-t-annot);
        border: var(--dw-rule-hair) solid var(--dw-ink-12);
        border-left: var(--dw-rule-bold) solid transparent;
        cursor: pointer;
      }
      .tr--cold {
        color: var(--dw-ink-55);
      }
      .tr--cold .tr-name {
        font-weight: 400;
      }
      .tr--active {
        border-left-color: var(--dw-ink);
        background: var(--dw-grid);
      }
      .tr--sel {
        outline: var(--dw-rule-thin) solid var(--dw-ink);
        outline-offset: 2px;
      }
      .tr-name {
        font-weight: 600;
        min-width: 15rem;
        white-space: nowrap;
      }
      .tr-kind {
        min-width: 4.5rem;
        flex: none;
      }
      .tr-ch,
      .tr-site,
      .tr-fx {
        font-size: var(--dw-t-micro);
        white-space: nowrap;
      }
      /* The channels fit at every width this pane takes; a call site's note is
         a whole sentence and does not. It is the one thing on the row that may
         be cut, so it is the only one allowed to shrink. */
      .tr-site {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tr-ch b {
        font-weight: 600;
      }
      .tr-fxs {
        margin-left: auto;
        display: flex;
        gap: var(--dw-s2);
        flex: none;
      }
      .tr-fx {
        color: var(--dw-ink-55);
      }
      #wires {
        position: absolute;
        inset: 0;
        overflow: visible;
        pointer-events: none;
      }

      /* -- a node is a part on the drawing --------------------------------- */
      .nd {
        position: absolute;
        width: 288px;
        background: var(--dw-paper);
        border: var(--dw-rule-bold) solid var(--dw-ink);
        padding: var(--dw-s2);
        cursor: pointer;
        overflow: hidden;
        transition: border-color 150ms;
      }
      /* Not reached: construction weight. The part is drawn, not yet built. */
      .nd--cold {
        border-width: var(--dw-rule-hair);
        border-color: var(--dw-ink-30);
        color: var(--dw-ink-55);
      }
      .nd--error {
        border-color: var(--dw-caution);
      }
      /* On the stack now: the double rule, straight off the deck's section
         sheets. No colour spent — position is not a state. */
      .nd--active {
        outline: var(--dw-rule-hair) solid var(--dw-ink-30);
        outline-offset: 4px;
      }
      .nd--sel {
        outline: var(--dw-rule-thin) solid var(--dw-ink);
        outline-offset: 7px;
      }

      .nd-top {
        display: flex;
        align-items: center;
        gap: var(--dw-s1);
        margin-bottom: 2px;
      }
      .nd-name {
        font-weight: 600;
        font-size: var(--dw-t-body);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nd-loc {
        font-size: var(--dw-t-micro);
        color: var(--dw-ink-55);
      }
      .nd-ch {
        display: grid;
        grid-template-columns: 1.2rem 1fr;
        gap: 0 var(--dw-s1);
        font-size: var(--dw-t-micro);
        margin-top: var(--dw-s1);
        padding-top: var(--dw-s1);
        border-top: var(--dw-rule-hair) solid var(--dw-ink-12);
      }
      .nd-ch b {
        font-weight: 600;
      }
      .nd-ch span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fired {
        color: var(--dw-caution);
      }
      .none {
        color: var(--dw-ink-30);
      }

      /* Effect rows are the callout motif: terminal dot, leader, then the note. */
      .fx {
        display: flex;
        align-items: center;
        gap: var(--dw-s1);
        font-size: var(--dw-t-micro);
        color: var(--dw-ink-55);
        margin-top: 3px;
      }
      .fx-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--dw-ink-30);
        flex: none;
      }
      .fx-lead {
        width: var(--dw-s2);
        border-top: var(--dw-rule-thin) solid var(--dw-ink-30);
        flex: none;
      }
      .fx--ok .fx-dot,
      .fx--ok .fx-lead {
        background: var(--dw-normal);
        border-top-color: var(--dw-normal);
      }
      .fx--fail .fx-dot,
      .fx--fail .fx-lead {
        background: var(--dw-caution);
        border-top-color: var(--dw-caution);
      }
      .fx-txt {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Breakpoint: a witness tick on the part's edge. Square, like everything. */
      .bp {
        width: 10px;
        height: 10px;
        padding: 0;
        flex: none;
        border: var(--dw-rule-hair) solid var(--dw-ink-30);
        background: transparent;
        cursor: pointer;
      }
      .bp--on {
        background: var(--dw-caution);
        border-color: var(--dw-caution);
      }

      /* -- cutaway: one node opened for inspection ------------------------- */
      .cut {
        grid-area: cut;
        border-top: var(--dw-rule-bold) solid var(--dw-ink);
        border-right: var(--dw-rule-bold) solid var(--dw-ink);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .cut-head {
        display: flex;
        align-items: baseline;
        gap: var(--dw-s2);
        padding: var(--dw-s1) var(--dw-s3);
        border-bottom: var(--dw-rule-hair) solid var(--dw-ink-12);
      }
      .tape {
        flex: 1;
        overflow: auto;
        padding: var(--dw-s2) var(--dw-s3) var(--dw-s3);
      }

      /* Tabs are the drawing's own move: one sheet, several views of it. */
      .tabs {
        margin-left: auto;
        display: flex;
        gap: var(--dw-s2);
      }
      .tab {
        border: 0;
        background: transparent;
        padding: 2px 0;
        font-size: var(--dw-t-micro);
        text-transform: uppercase;
        letter-spacing: var(--dw-track-label);
        color: var(--dw-ink-55);
        cursor: pointer;
        border-bottom: var(--dw-rule-bold) solid transparent;
        transition:
          color 150ms,
          border-color 150ms;
      }
      .tab--on {
        color: var(--dw-ink);
        border-bottom-color: var(--dw-ink);
      }

      /* -- the file-tree diff ---------------------------------------------- */
      .fgroup {
        margin-bottom: var(--dw-s3);
      }
      .fgroup > .dw-label {
        display: block;
        margin-bottom: var(--dw-s1);
      }
      .frow {
        display: grid;
        grid-template-columns: 3.2rem 1fr 4.5rem;
        gap: var(--dw-s2);
        align-items: baseline;
        font-size: var(--dw-t-annot);
        padding: 1px 0;
      }
      .frow--shared {
        color: var(--dw-caution);
      }
      .fchange {
        font-size: var(--dw-t-micro);
        text-transform: uppercase;
        letter-spacing: var(--dw-track-label);
        color: var(--dw-ink-55);
      }
      .fpath {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fdir {
        color: var(--dw-ink-55);
      }
      .fwhy {
        grid-column: 2 / -1;
        font-size: var(--dw-t-micro);
        color: var(--dw-ink-55);
      }
      .fnum {
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-size: var(--dw-t-micro);
        color: var(--dw-ink-55);
      }

      /* -- the contract sheet ---------------------------------------------- */
      .contract .dw-titleblock-cell {
        border-bottom: var(--dw-rule-hair) solid var(--dw-ink-12);
      }
      .contract .dw-titleblock-val {
        font-size: var(--dw-t-annot);
      }
      .tp {
        display: flex;
        align-items: flex-start;
        gap: var(--dw-s2);
        font-size: var(--dw-t-annot);
        line-height: 1.5;
        padding: 1px 0 1px var(--dw-s2);
        border-left: var(--dw-rule-bold) solid transparent;
      }
      .tp--past {
        color: var(--dw-ink-55);
      }
      .tp--here {
        border-left-color: var(--dw-ink);
        background: var(--dw-grid);
      }
      .tp-n {
        width: 1.5rem;
        text-align: right;
        color: var(--dw-ink-30);
        font-size: var(--dw-t-micro);
        flex: none;
        padding-top: 2px;
      }
      .tp-lbl {
        width: 5rem;
        flex: none;
        font-size: var(--dw-t-micro);
        text-transform: uppercase;
        letter-spacing: var(--dw-track-label);
        color: var(--dw-ink-55);
        padding-top: 2px;
      }
      .tp-src {
        min-width: 0;
        flex: 1;
      }
      .kw {
        font-weight: 600;
      }
      .dim {
        color: var(--dw-ink-55);
      }

      /* -- side column ----------------------------------------------------- */
      .side {
        grid-area: side;
        overflow: auto;
        display: flex;
        flex-direction: column;
      }
      .blk {
        padding: var(--dw-s2) var(--dw-s3) var(--dw-s3);
        border-bottom: var(--dw-rule-hair) solid var(--dw-ink-12);
      }
      .blk > .dw-label {
        display: block;
        margin-bottom: var(--dw-s1);
      }
      /* The holds sit above the blocks they act on — hold-on-effect over the
         effects ledger, hold-on-error over the error path — rather than beside
         the step buttons. The head drives the walk forward; these say where it
         stops, which is a different question. (#33.) */
      .blk.holds {
        display: flex;
        gap: var(--dw-s3);
        align-items: center;
        padding: var(--dw-s2) var(--dw-s3);
        border-bottom: var(--dw-rule-bold) solid var(--dw-ink);
      }
      .row {
        display: flex;
        gap: var(--dw-s1);
        font-size: var(--dw-t-annot);
        align-items: baseline;
      }
      .row-k {
        color: var(--dw-ink-55);
        flex: none;
      }
      .row-v {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .frame {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        border-left: var(--dw-rule-bold) solid transparent;
        padding: 2px var(--dw-s2);
        cursor: pointer;
        background: transparent;
        font-size: var(--dw-t-annot);
      }
      .frame--top {
        border-left-color: var(--dw-ink);
      }
      .frame--sel {
        background: var(--dw-grid);
      }
      .var {
        display: flex;
        align-items: center;
        gap: var(--dw-s1);
        margin-bottom: 2px;
      }
      .var-k {
        width: 7rem;
        flex: none;
        font-size: var(--dw-t-micro);
        color: var(--dw-ink-55);
        text-align: right;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* The inputs are read, not typed into, so the value is a .row-v pair the
         way the blocks above it are — no border, no caret, nothing promising an
         edit the sheet can no longer honour. */
      .var .row-v {
        flex: 1;
        font-size: var(--dw-t-annot);
      }
      .var input {
        flex: 1;
        min-width: 0;
        font-size: var(--dw-t-micro);
        border-color: var(--dw-ink-12);
        padding: 2px 4px;
      }
      .led {
        display: flex;
        gap: var(--dw-s1);
        font-size: var(--dw-t-micro);
        padding: 2px 0;
        border-bottom: var(--dw-rule-hair) solid var(--dw-ink-12);
      }
      .led:last-child {
        border-bottom: 0;
      }
      .led-seq {
        color: var(--dw-ink-30);
        flex: none;
      }
      .led-body {
        min-width: 0;
        flex: 1;
      }
      .led-body div {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ok {
        color: var(--dw-normal);
      }
      .caut {
        color: var(--dw-caution);
      }

      /* -- title block ----------------------------------------------------- */
      .block {
        grid-area: block;
      }
      .dw-titleblock {
        border-left: 0;
        border-right: 0;
        border-bottom: 0;
      }

      /* The trace is a measured span, so it is drawn as a dimension line. */
      .trace {
        grid-column: 1 / -1;
        padding: var(--dw-s2) var(--dw-s3);
        border-top: var(--dw-rule-hair) solid var(--dw-ink-12);
      }
