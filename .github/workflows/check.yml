name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the version-bump check compares this branch
      # against its merge base. A shallow clone has no merge base to find.
      #
      # persist-credentials: false because every git command this job runs is a
      # local read of a history the checkout already fetched. `merge-base`,
      # `rev-parse`, `diff --name-only` and `show` in scripts/check.mjs all read
      # the object store and none of them contacts a remote — including
      # `merge-base origin/main HEAD`, because fetch-depth: 0 fetches
      # refs/heads/* into refs/remotes/origin/*, so origin/main is on disk
      # before the first step after this one runs. The default writes the job's
      # token into .git/config as an http.extraheader, which buys those reads
      # nothing and leaves a credential in the working tree. Raised by zizmor as
      # `artipacked`, and gated by .github/workflows/zizmor.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node scripts/check.mjs
