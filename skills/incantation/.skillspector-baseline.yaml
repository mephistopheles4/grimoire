# SkillSpector baseline for this skill.
#
# You are reading this because you scanned this directory before installing
# what is in it, which is the right thing to do with a skill. Two of
# SkillSpector's rules fire on the files here, and this file says why each is
# accepted, so you can disagree with a reason rather than with silence.
#
# LP3 is accepted: the skill declares no permission list, because that is one
# host's format and the skill's text runs in agents that read none.
#
# RA2 fires in four places: on SKILL.md, where it tells the session to write the
# line it wants spoken to a file in the skill's own state folder (the listener
# reads it once and deletes it); on references/observe.md, where observe-only
# mode logs each candidate line through an inbox file in that folder to a local
# log; and as a false positive on README.md, where
# the privacy note documents that setup.mjs writes sherpa into settings.json on
# fresh installs and that Windows speaker loopback keeps at most 100 ms in RAM
# and writes nothing to disk; and as a false positive on scripts/lib.mjs, where
# the rule's hidden-folder pattern runs from a parameter named create to a later
# comment. The README.md and scripts/lib.mjs entries each cover the whole file,
# and review holds them.
#
# The scanner reports the score unchanged and applies none of this unless you
# ask. Apply it with --use-shipped-baseline, and read what it covered with
# --show-suppressed. Nothing here was reworded to satisfy a pattern matcher. The
# repository root carries these rules in the same words; its check lets a
# skill's entry be narrower than the root's, never broader.

version: 2
fingerprints: []

rules:
  - rule_id: "LP3"
    reason: "Accepted. The skill declares no permission list, because a permission list is one host's format and the skill's text runs in agents that read none. SECURITY.md in the repository says which script reaches the network, when it runs, and what it sends."
  - rule_id: "RA2"
    file: "SKILL.md"
    reason: "Eight findings, one rule. False positive: the CONTRIBUTING.md rule forbidding a fixed path inside a skill, and the test proving that rule fires; a guard and its test, both reported as the risk they exist to prevent. Not a false positive, and accepted: eagle-eye's usage log keeps a start and an end line per box in a file in the person's home folder, across sessions, and only after the person says yes in chat. A no is stored as one declined marker. The skill never writes inside its own folder. Also accepted: the contract skill's bindings name the folders where a person's agents already live, such as .codex/agents/, so a built agent written there loads in later sessions. The skill asks the person before any write that would install, and writes no agent without the person's go. Also accepted: the contract skill's hiring page keeps a person's answers in the browser until they press Reset, unencrypted, the accepted risk of 2026-10-18. Also accepted: Incantation's skill tells the session to write the one line it wants spoken to a new file named say- followed by 8 hex digits, in the observe folder of the person's own ~/.grimoire/incantation folder; the listener reads that file once and deletes it, so the spoken words never pass through a command, and the session writes nothing else there. The scanner reports that one sentence twice. Also accepted: in observe-only mode, which only the person's typed /incantation observe starts, the skill tells the session to write each candidate line to a new inbox file in that same observe folder; observe.mjs appends it to a local log there and deletes the file, and the skill forbids posting the log or putting it in a record. False positive: Incantation's README documents that setup.mjs writes sherpa into settings.json on fresh installs and that Windows speaker loopback keeps at most 100 ms in RAM and writes nothing to disk; it describes local behaviour for a reader, not session persistence. False positive: in Incantation's scripts/lib.mjs the scanner's hidden-folder pattern runs from the parameter named create of ensureFolder to a later comment that names a folder under the home folder. The function makes only the skill's own state folders, and that is accepted."
