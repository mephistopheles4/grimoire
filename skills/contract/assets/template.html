<script>
'use strict';
/* The hiring page. Every rule it follows is in the module above, which the
   interview script runs too: the marks, the block, the tally, restore,
   redraft and Forget. This script draws the page and keeps its state.

   Three rules hold throughout. Draft text goes into the page only as element
   content or through value and textContent, never into an attribute. Ids
   and field names come from the checked draft and kinds table, and are kept
   on elements as properties, never as attributes. Accessible names that hold
   clause text are set through aria-labelledby to an element that holds it. */
const D = /*DATA*/;
const draft = D.draft;
const kinds = D.kinds;
const hashes = D.hashes;
const PARTS = kinds.parts;
const KIND = new Map(kinds.kinds.map(k => [k.id, k]));
const QUESTION = new Map(draft.questions.map(q => [q.clause, q]));
const DRAFTED = new Map();
for (const part of PARTS) for (const c of draft.parts[part]) DRAFTED.set(c.id, { c, part });
const PLAIN = draft.type === 'CLAUDE.md';
const FRAME = PLAIN ? 'plain' : 'hiring';
const ASKED = new Set(kinds.levels[draft.level]);
/* Kinds the letter carries even without a question: the name, the job, why
   we are hiring, and great work. Every clause with a question is a term of the
   letter too; every other clause sits in its kind's schedule. */

const HEADS = PLAIN
  ? Object.fromEntries(PARTS.map(p => [p, p]))

/* The store: the browser's local storage on a page opened from disk, and
   nothing on the published example. Any read or write may throw; the module
   survives that, and so does this. */
const store = D.site ? null : (() => { try { const s = window.localStorage; void s.length; return s; } catch (e) { return null; } })();

const S = {
  answers: new Map(),
  edits: [],
  open: null,      // the clause whose question is open in the letter
  own: new Set(),  // clauses answered "none of these, I will say it myself"
  picked: new Map(), // the option the person picked, kept for the radio after an edit
  schedOpen: new Set(),
  renaming: null,
  rekinding: null,
  adding: null,
  signing: false,
  forgotten: false,
  status: '',
  fresh: null,

const notes = [];

/* -- start: carry over a redraft's answers, then restore ------------------ */
const describe = id => {
  const d = DRAFTED.get(id);
  if (!d) return id;
  return `${KIND.get(d.c.kind).kind} (${id})`;
};
{
  const rd = Interview.redraft(store, draft, kinds, hashes, { shared: D.shared });
  if (rd.adopted.length) notes.push(['Carried over from the earlier draft, unchanged:', rd.adopted.map(describe)]);
  if (rd.dropped.length) notes.push(['Dropped, because the clause or the option you picked changed:', rd.dropped.map(describe)]);
  if (rd.note) notes.push([rd.note, []]);
  const rs = Interview.restore(store, draft, kinds, hashes);
  S.answers = rs.state.answers;
  S.edits = rs.state.edits;
  if (rs.count) notes.push([`${rs.count} ${rs.count === 1 ? 'answer came' : 'answers came'} back from this browser. Each is marked restored until you touch it.`, []]);
  if (rs.state.edits.length) notes.push([`${rs.state.edits.length} ${rs.state.edits.length === 1 ? 'change' : 'changes'} to the schedules came back too, marked restored. Keep each one below, or it stays a proposal.`, []]);
  if (rs.dropped) notes.push(['Answers saved in this browser did not fit this draft, so they were dropped.', []]);
}

/* -- small helpers ------------------------------------------------------------ */
const still = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
let uid = 0;
const newDomId = () => `el-${++uid}`;
/** An element. `props` are DOM properties, never attribute strings, except
 *  for a few fixed attribute names whose values never hold draft text. */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'on') for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);

const capital = s => s.charAt(0).toUpperCase() + s.slice(1);
const markEl = (mark, restored) => {

  return h('span', { class: `mark ${mark || ''}${restored ? ' restored' : ''}` }, restored ? `${m}, restored` : m);
};
const idsInUse = () => {
  const ids = new Set(DRAFTED.keys());
  for (const q of draft.questions) { ids.add(q.id); for (const o of q.options) ids.add(o.id); }
  for (const e of S.edits) if (e.op === 'add') ids.add(e.id);
  return ids;
};
const newId = () => { const used = idsInUse(); let n = 1; while (used.has(`added-${n}`)) n++; return `added-${n}`; };

  const f = {};
  for (const x of kind.fields) {
    if (x.optional && !(from && Object.hasOwn(from, x.name))) continue;
    if (x.type === 'choice') f[x.name] = from && kinds.choices[x.name].includes(from[x.name]) ? from[x.name] : kinds.choices[x.name][0];
    else f[x.name] = from && typeof from[x.name] === 'string' ? from[x.name] : '';
  }
  return f;
};

  const ka = Object.keys(a || {});
  return ka.length === Object.keys(b || {}).length && ka.every(k => Object.hasOwn(b, k) && a[k] === b[k]);
};

  if (S.forgotten) return;
  Interview.save(store, draft, kinds, hashes, S);
}
/** A change that redraws the page. */
function act(fn) {
  fn();
  persist();
  render();
}
/** The fields a clause shows now. */
function shownFields(id) {
  const a = S.answers.get(id);
  const d = DRAFTED.get(id);
  if (a && Object.hasOwn(a, 'option')) return QUESTION.get(id).options.find(o => o.id === a.option).fields;
  if (a) return a.fields;
  return d && d.c.fields;
}
/** Where a live clause's fields are kept: the last re-kind of it, the edit
 *  that added it, or else the person's answer on a drafted clause. */
function owner(id) {
  for (let i = S.edits.length - 1; i >= 0; i--) {
    const e = S.edits[i];
    if (e.op === 'rekind' && e.id === id) return { edit: e };
    if (e.op === 'add' && e.id === id) return { edit: e };
  }
  return { drafted: id };
}
/** An answer the person touched: whatever it held before, it is no longer
 *  restored. */
function answer(id, value) {
  const prev = S.answers.get(id) || {};
  const next = { ...value };
  if (prev.chip !== undefined && next.chip === undefined && !Object.hasOwn(value, 'chip')) next.chip = prev.chip;
  if (prev.flag && !Object.hasOwn(value, 'flag')) next.flag = true;
  delete next.restored;
  S.answers.set(id, next);
}
function setField(id, name, value) {
  const o = owner(id);
  if (o.edit) {
    o.edit.fields = { ...o.edit.fields, [name]: value };
    delete o.edit.restored;
    return;
  }
  const a = S.answers.get(id) || {};
  const fields = { ...shownFields(id), [name]: value };
  const keep = {};
  if (a.chip !== undefined) keep.chip = a.chip;
  if (a.flag) keep.flag = true;
  S.answers.set(id, { fields, ...keep });
}
function agree(id) {
  const d = DRAFTED.get(id);
  if (!d || d.c.none) return;
  const a = S.answers.get(id);
  if (a && !a.restored) return;
  if (a && a.restored) { const { restored, ...rest } = a; void restored; S.answers.set(id, rest); return; }
  answer(id, { fields: { ...d.c.fields } });

function edit(e) { S.edits.push(e); }

/* -- the current contract, as the module reads it ------------------------------ */
let V = null;
const refreshers = [];
/** Re-read the state into every live element without redrawing, so typing
 *  in a field never loses its place. */
function refresh() {
  V = Interview.view(draft, kinds, hashes, S);
  for (const fn of refreshers) fn();
}
const live = (el, fn) => { refreshers.push(() => fn(el)); fn(el); return el; };

/** Whether a live clause is a term of the letter. */
const inLetter = x => {
  const d = DRAFTED.get(x.id);
  return Boolean(d && d.c.kind === x.kind.id && (QUESTION.has(x.id) || LETTER_KINDS.has(x.kind.id)));
};
/** The kinds of a part in the order the export writes them. */
function kindOrder(part) {
  const list = V.parts.get(part);
  const out = [];
  for (const k of V.order.get(part)) if (list.some(x => x.kind.id === k)) out.push(k);
  for (const x of list) if (!out.includes(x.kind.id)) out.push(x.kind.id);
  return out;
}
/** Every schedule, in page order, each with its letter. */
function schedules() {
  const out = [];
  for (const part of PARTS) for (const k of kindOrder(part)) {
    const entries = V.parts.get(part).filter(x => x.kind.id === k && !inLetter(x));
    if (entries.length) out.push({ part, kind: KIND.get(k), entries, key: `${part}/${k}` });
  }
  out.forEach((s, i) => { s.letter = i < 26 ? String.fromCharCode(65 + i) : String(i + 1); });
  return out;
}
const scheduleName = s => V.names.get(s.key) || capital(s.kind.kind);
const answered = id => S.answers.has(id) && !S.answers.get(id).restored;

/* -- the page ------------------------------------------------------------------- */
const app = document.getElementById('app');

/** Redraw everything, and put the focus back on the element that had it. */
function render() {
  const active = document.activeElement && document.activeElement.pageKey;
  const sel = active && document.activeElement.selectionStart !== undefined ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
  refreshers.length = 0;
  V = Interview.view(draft, kinds, hashes, S);
  const keyed = new Map();
  const frag = h('div', null, topBar(), noticesEl(), notesEl(), progressEl(), S.signing ? signing() : [letter(), schedulesSheet()], statusEl());
  frag.querySelectorAll('*').forEach(el => { if (el.pageKey) keyed.set(el.pageKey, el); });
  app.replaceChildren(frag);
  for (const el of app.querySelectorAll('textarea.ed, textarea.why')) size(el);
  const back = active && keyed.get(active);
  if (back) {
    back.focus();
    if (sel && back.setSelectionRange) try { back.setSelectionRange(sel[0], sel[1]); } catch (e) { /* not a text control */ }
  }
  if (S.fresh) { const f = keyed.get(S.fresh); S.fresh = null; if (f) f.focus(); }
}
const size = el => { el.style.height = 'auto'; el.style.height = `${el.scrollHeight}px`; };

/* The light and dark switch, as on groundtrack's page. */
const MOON = 'M16.124 4 A 9 9 0 1 0 16.124 20 A 8 8 0 0 1 16.124 4 Z';
function icon(dark) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.4');
  svg.setAttribute('aria-hidden', 'true');
  if (dark) {
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', '12'); c.setAttribute('cy', '12'); c.setAttribute('r', '5');
    svg.append(c);
    for (let i = 0; i < 12; i++) {
      const a = (i * Math.PI) / 6;

  const title = h('b', null, scheduleName(s));
  const state = pending ? h('span', { class: 'mark Proposed' }, `${s.entries.length - pending} of ${s.entries.length} agreed`) : markEl(s.entries.some(x => x.mark === 'Decided') ? 'Decided' : 'Confirmed');

    at > 0 && ['Move up', () => act(() => { edit({ op: 'move', part: s.part, kind: s.kind.id, to: order.indexOf(siblings[at - 1].kind.id) }); S.fresh = `menu:${s.key}`; })],
    at < siblings.length - 1 && ['Move down', () => act(() => { edit({ op: 'move', part: s.part, kind: s.kind.id, to: order.indexOf(siblings[at + 1].kind.id) }); S.fresh = `menu:${s.key}`; })],
    ['It needs none of these', () => act(() => { edit({ op: 'none', part: s.part, kind: s.kind.id }); for (const x of s.entries) S.answers.delete(x.id); })],
    ['Remove', () => fadeOut(det, () => act(() => { edit({ op: 'remove', part: s.part, kind: s.kind.id }); for (const x of s.entries) S.answers.delete(x.id); }))],
  ], `menu:${s.key}`);

      if (e.key === 'Enter') { e.preventDefault(); const name = e.target.value.trim(); act(() => { S.renaming = null; if (name && name !== scheduleName(s)) renameSchedule(s, name); S.fresh = `menu:${s.key}`; }); }
      if (e.key === 'Escape') { e.preventDefault(); act(() => { S.renaming = null; S.fresh = `menu:${s.key}`; }); }
    } } });
    body.append(h('div', { class: 'note' }, h('label', { htmlFor: id, class: 'small' }, 'New name for this schedule (Enter to keep, Escape to cancel) '), input));
  }

function renameSchedule(s, name) {

function addSchedule(part) {

      h('button', { type: 'button', key: `addgo:${part}`, on: { click: () => act(() => { S.adding = null; addEntry(part, KIND.get(sel.value)); }) } }, 'Add'), ' ',
      h('button', { type: 'button', class: 'quiet', on: { click: () => act(() => { S.adding = null; S.fresh = `addsched:${part}`; }) } }, 'Cancel'));

/** One entry: a labelled record, one line per field. */
function record(x, where) {
  const a = S.answers.get(x.id);
  const restored = Boolean(a && a.restored) || S.edits.some(e => e.restored && (e.id === x.id || (e.op === 'none' && `none:${e.kind}` === x.id)));
  const rec = h('div', { class: `rec${S.justAdded === x.id ? ' fade-in' : ''}` });
  if (S.justAdded === x.id) S.justAdded = null;
  const high = x.kind.stakes === 'high';
  if (where.inLetter) rec.append(h('p', { class: 'lbl' }, capital(x.kind.kind)));
  if (x.none) {
    rec.append(h('p', null, 'None'));
  } else {
    rec.append(fieldsEditor(x));
  }
  const mark = live(h('span'), el => {
    const y = V.parts.get(partOf(x.id)).find(z => z.id === x.id);
    const b = S.answers.get(x.id);
    el.replaceChildren(markEl(y ? y.mark : x.mark, (b && b.restored) || restored));
  });
  const foot = h('div', { class: 'rec-foot' }, mark);
  const d = DRAFTED.get(x.id);
  if (d && !x.none && !high && (!a || a.restored)) foot.append(h('button', { type: 'button', class: 'quiet', key: `agree:${x.id}`, on: { click: () => act(() => agree(x.id)) } }, 'Agree'));
  if (d && !x.none && high && a && a.restored) foot.append(h('button', { type: 'button', class: 'quiet', key: `keep:${x.id}`, on: { click: () => act(() => agree(x.id)) } }, 'Keep'));
  if (high && !x.none) foot.append(h('span', { class: 'small muted' }, 'your own words go in chat'));
  if (x.none) foot.append(h('button', { type: 'button', class: 'quiet', key: `replace:${x.id}`, on: { click: () => act(() => {
    if (d) edit({ op: 'remove', id: x.id }); else edit({ op: 'remove', part: partOf(x.id), kind: x.kind.id });
    addEntry(partOf(x.id), x.kind);
  }) } }, 'Replace with an entry'));
  if (d && !x.none) foot.append(flagBox(x.id));
  if (!x.none && where.schedule) foot.append(entryMenu(x, where.schedule));
  if (S.rekinding === x.id) rec.append(rekindPick(x));
  rec.append(foot);
  return rec;
}
const partOf = id => { for (const [part, list] of V.parts) if (list.some(z => z.id === id)) return part; return null; };

function entryMenu(x, s) {
  const list = V.parts.get(s.part);
  const same = list.map((z, i) => [z, i]).filter(([z]) => z.kind.id === s.kind.id && !inLetter(z));
  const at = same.findIndex(([z]) => z.id === x.id);
  const n = s.entries.indexOf(x) + 1;
  return menuEl(`Actions for entry ${n} of schedule ${s.letter}`, [
    at > 0 && ['Move up', () => act(() => { edit({ op: 'move', id: x.id, to: same[at - 1][1] }); S.fresh = `menu:${x.id}`; })],
    at < same.length - 1 && ['Move down', () => act(() => { edit({ op: 'move', id: x.id, to: same[at + 1][1] }); S.fresh = `menu:${x.id}`; })],
    kinds.kinds.some(k => k.part === s.part && k.id !== x.kind.id && k.id !== 'why' && !(k.types && !k.types.includes(draft.type))) && ['Change its kind', () => act(() => { S.rekinding = x.id; S.fresh = `rekind:${x.id}`; })],
    ['Remove', e => fadeOut(e && e.closest ? e.closest('.rec') : null, () => act(() => { edit({ op: 'remove', id: x.id }); S.answers.delete(x.id); }))],
  ], `menu:${x.id}`);
}

function rekindPick(x) {
  const part = partOf(x.id);
  const choices = kinds.kinds.filter(k => k.part === part && k.id !== x.kind.id && k.id !== 'why' && !(k.id === 'name' && PLAIN) && !(k.types && !k.types.includes(draft.type)));
  const id = newDomId();
  const sel = h('select', { class: 'pick', id, key: `rekind:${x.id}` }, choices.map(k => h('option', { value: k.id }, capital(k.kind))));
  return h('div', { class: 'note' }, h('label', { htmlFor: id, class: 'small' }, 'Change its kind to '), sel, ' ',
    h('button', { type: 'button', on: { click: () => act(() => {
      const kind = KIND.get(sel.value);
      edit({ op: 'rekind', id: x.id, kind: kind.id, fields: emptyFields(kind, x.fields) });
      S.answers.delete(x.id);
      S.rekinding = null;
      S.schedOpen.add(`${part}/${kind.id}`);
      S.fresh = `field:${x.id}:${kind.fields[0].name}`;
    }) } }, 'Change'), ' ',
    h('button', { type: 'button', class: 'quiet', on: { click: () => act(() => { S.rekinding = null; S.fresh = `menu:${x.id}`; }) } }, 'Cancel'));
}

/** A small menu: Tab to its button, arrows inside, Enter to act, Escape to
 *  leave. */
function menuEl(label, items, key) {
  const actions = items.filter(Boolean);
  const listId = newDomId();
  const btn = h('button', { type: 'button', key, aria: { haspopup: 'menu', expanded: 'false', controls: listId, label } }, '⋯');
  const ul = h('ul', { role: 'menu', id: listId, hidden: true });
  const buttons = actions.map(([text, fn]) => h('li', { role: 'none' }, h('button', { type: 'button', role: 'menuitem', tabIndex: -1, on: { click: e => { close(); fn(e.target); } } }, text)));
  ul.append(...buttons);
  const items$ = () => [...ul.querySelectorAll('button')];
  const openMenu = first => { ul.hidden = false; btn.setAttribute('aria-expanded', 'true'); const list = items$(); (first === 'last' ? list[list.length - 1] : list[0]).focus(); };
  const close = () => { ul.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
  btn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); if (ul.hidden) openMenu(); else close(); });
  btn.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); openMenu(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); openMenu('last'); }
  });
  ul.addEventListener('keydown', e => {
    const list = items$();
    const i = list.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); list[(i + 1) % list.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); list[(i - 1 + list.length) % list.length].focus(); }
    else if (e.key === 'Home') { e.preventDefault(); list[0].focus(); }
    else if (e.key === 'End') { e.preventDefault(); list[list.length - 1].focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); close(); btn.focus(); }
    else if (e.key === 'Tab') close();
  });
  ul.addEventListener('click', e => e.stopPropagation());
  return h('span', { class: 'menu' }, btn, ul);
}

/* Motion. Each one is skipped under reduced motion. */
/* An animation's end, or a timer just past it: a page in a background tab
   may never finish an animation, and the change must still land, once. */
function afterMotion(anim, ms, then) {
  let ran = false;
  const once = () => { if (!ran) { ran = true; then(); } };
  anim.onfinish = once;
  setTimeout(once, ms + 60);
}
function slide(det, body, key) {
  const done = open => { if (open) S.schedOpen.add(key); else S.schedOpen.delete(key); };
  if (still() || !body.animate) { det.open = !det.open; done(det.open); return; }
  if (det.open) {
    const from = body.offsetHeight;
    afterMotion(body.animate([{ height: `${from}px`, opacity: 1 }, { height: '0px', opacity: 0 }], { duration: 180, easing: 'ease-in' }), 180, () => { det.open = false; done(false); });
  } else {
    det.open = true;
    done(true);
    for (const el of body.querySelectorAll('textarea.ed')) size(el);
    const to = body.offsetHeight;
    body.animate([{ height: '0px', opacity: 0 }, { height: `${to}px`, opacity: 1 }], { duration: 220, easing: 'ease-out' });
  }
}
function fadeOut(el, then) {
  if (still() || !el || !el.animate) { then(); return; }
  el.style.overflow = 'hidden';
  afterMotion(el.animate([{ opacity: 1, height: `${el.offsetHeight}px` }, { opacity: 0, height: '0px' }], { duration: 180, easing: 'ease-in' }), 180, then);
}

/* -- signing --------------------------------------------------------------------- */
function signing() {
  const t = Interview.tally(draft, S);
  const block = Interview.blockText(Interview.blockOf(draft, kinds, hashes, S));
  const restored = [...S.answers.values()].filter(a => a.restored).length;
  const flags = [...S.answers.values()].filter(a => a.flag).length;
  const terms = [...QUESTION.keys()].filter(id => DRAFTED.has(id));
  const open = terms.filter(id => !S.answers.has(id)).length;
  const why = [...DRAFTED.values()].find(d => d.c.kind === 'why');
  const boxId = newDomId();
  const ta = h('textarea', { class: 'block', id: boxId, readOnly: true, value: block, key: 'block', spellcheck: false });
  const copy = h('button', { type: 'button', class: 'primary', key: 'copy', on: { click: () => {
    const fail = () => { ta.focus(); ta.select(); S.status = 'Copying did not work here. The block is selected below: copy it with your keyboard.'; document.querySelector('.status').textContent = S.status; };
    try {
      navigator.clipboard.writeText(block).then(() => { S.status = 'Copied. Paste it in chat.'; document.querySelector('.status').textContent = S.status; }, fail);
    } catch (e) { fail(); }
  } } }, 'Copy the answer block');
  return h('section', { class: 'av-sheet av-sheet--surface', aria: { label: 'Signing' } },
    h('p', { class: 'lbl' }, 'The signed copy'),
    h('h2', null, 'Here is what you agreed.'),
    h('div', { class: 'tally' },
      h('div', null, h('b', null, String(t.proposalsTaken)), 'proposals taken as drafted'),
      h('div', null, h('b', null, String(t.otherPicks)), 'other options picked'),
      h('div', null, h('b', null, String(t.edited)), 'answers in your own words or edited'),
      h('div', null, h('b', null, String(flags)), 'flagged for chat'),
      h('div', null, h('b', null, String(restored)), 'restored, not touched since'),
      h('div', null, h('b', null, String(open)), 'terms in the letter not answered')),
    t.proposalsTaken > 0 && t.otherPicks + t.edited === 0 ? h('p', { class: 'warn' }, 'You took every proposal as drafted. That can be right: check that you meant each one.') : null,
    why && !S.answers.has(why.c.id) ? h('p', { class: 'warn' }, 'Why we are hiring is still empty. Nothing is built until you write it.') : null,
    h('p', { class: 'small' }, 'Back in chat, Claude asks one question at a time on each high-stakes term and each one you flagged.'),
    h('div', { class: 'group' }, copy),
    h('label', { htmlFor: boxId, class: 'small' }, 'Your answer block, as text you can select'),
    ta);
}

render();
</script>
