# SkillSpector baseline for this skill.
#
# You are reading this because you scanned this directory before installing
# what is in it, which is the right thing to do with a skill. Six of
# SkillSpector's rules fire on the files here, and this file says why for each,
# so you can disagree with a reason rather than with silence.
#
# EA2, Autonomous Decision Making, fires on text that names what an agent may
# do without asking, in order to warn about it: the three bindings, this
# skill's own contract and its change log. None of it tells an agent to act
# without the person.
#
# P2, Hidden Instructions, fires on the begin and end comment lines that fence
# each generated part of SKILL.md. A fence names its part and nothing else; the
# text between two fences is the skill's ordinary, visible instructions.
#
# RA2, Session Persistence, fires on a binding naming the folder where a
# person's agents already live. That one is accepted, not a false positive: a
# built agent written there loads in later sessions. The skill asks before any
# write that would install. It also fires on the README's paragraph saying the
# hiring page keeps a person's answers in the browser until they press Forget,
# unencrypted. That is true, and accepted: the owner accepted it on 2026-10-18.
#
# EA3 fires on the phrase NOT LIMITED TO in assets/OFL.txt, the font licence's
# warranty text, which the licence requires to travel with the fonts the page
# carries. It is a legal text, not an instruction.
#
# MP1, Persistent Context Injection, fires on a row of the change log that
# records why the skill was rebuilt. It is history for a person to read.
#
# LP3 fires on SKILL.md because the skill ships scripts and declares no
# permission list. That one is accepted: a permission list is one host's
# format. The interview script, scripts/render.mjs, reaches no network and runs
# no other program; it writes and deletes only its own files in a scratch
# folder it made. The owner accepted the entry on 2026-10-18.
#
# Each entry names the one file its rule fired on when the entries were
# measured, with SkillSpector v2.13.0 on 2026-10-18. EA2 fires on five files,
# so it has five entries. The path is exact, and the scanner matches it
# ignoring letter case. A finding of the same rule in any other file is
# reported, and it fails this repository's build. That holds for a scan of
# this skill's own folder. A scanner that ignores `file` applies each entry to
# the whole folder.
#
# An entry that names a file and no message covers every finding of its rule
# anywhere in that file, not only the line it was measured on. Read this
# before you install: P2 covers all of SKILL.md, the text an agent obeys, so
# an instruction hidden there in a comment, a link-reference comment or a
# base64 data link would pass the scan. RA2 covers all of
# references/binding-codex.md, so an instruction there to persist on your
# machine (a scheduled job, a startup or profile file, a background process or
# a hidden folder) would pass too. Review is what holds those files; read them
# yourself, the comments included. references/template.md, which seeds every
# file this skill generates, is named by no entry. The owner accepted the EA2
# breadth on 2026-09-27, and the P2, RA2 and MP1 entries on 2026-10-15, each
# then for the whole skill; the owner narrowed EA2, P2 and RA2 to these files
# on 2026-10-18, and accepted the RA2 entry on README.md and the EA3 entry on
# assets/OFL.txt on 2026-10-18, for the hiring page.
#
# The scanner reports the score unchanged and applies none of this unless you
# ask. Apply it with --use-shipped-baseline, and read what it covered with
# --show-suppressed.
#
# Nothing here was reworded to satisfy a pattern matcher.
#
# The repository this skill comes from carries the same rules at its root,
# rule-wide, for a scan of the whole repository, covering the rules that fire
# outside this directory. Its check lets a skill's entry be narrower than the
# root's, never broader, and refuses one that gives a different reason.
version: 2
fingerprints: []

rules:
  - rule_id: "EA2"
    file: "references/binding-antigravity.md"
    reason: "False positive. Texts that describe what an agent may do on its own and give no such instruction: the why text on an edge in an example box file, which a renderer prints for a reader; the labels, headings and comments in a format check, its bindings and its README that name the settings the check warns on because they let an agent act without asking; a step that lists unconfirmed drafts as Proposed without asking about each one, which keeps them unconfirmed until the person agrees; and eagle-eye's rule that when the person asks for the box by name, it builds the box without asking again, because the request is the go-ahead. None tells an agent to act without the person's say-so."
  - rule_id: "EA2"
    file: "references/binding-claude.md"
    reason: "False positive. Texts that describe what an agent may do on its own and give no such instruction: the why text on an edge in an example box file, which a renderer prints for a reader; the labels, headings and comments in a format check, its bindings and its README that name the settings the check warns on because they let an agent act without asking; a step that lists unconfirmed drafts as Proposed without asking about each one, which keeps them unconfirmed until the person agrees; and eagle-eye's rule that when the person asks for the box by name, it builds the box without asking again, because the request is the go-ahead. None tells an agent to act without the person's say-so."
  - rule_id: "EA2"
    file: "references/binding-codex.md"
    reason: "False positive. Texts that describe what an agent may do on its own and give no such instruction: the why text on an edge in an example box file, which a renderer prints for a reader; the labels, headings and comments in a format check, its bindings and its README that name the settings the check warns on because they let an agent act without asking; a step that lists unconfirmed drafts as Proposed without asking about each one, which keeps them unconfirmed until the person agrees; and eagle-eye's rule that when the person asks for the box by name, it builds the box without asking again, because the request is the go-ahead. None tells an agent to act without the person's say-so."
  - rule_id: "EA2"
    file: "references/contract.changelog.md"
    reason: "False positive. Texts that describe what an agent may do on its own and give no such instruction: the why text on an edge in an example box file, which a renderer prints for a reader; the labels, headings and comments in a format check, its bindings and its README that name the settings the check warns on because they let an agent act without asking; a step that lists unconfirmed drafts as Proposed without asking about each one, which keeps them unconfirmed until the person agrees; and eagle-eye's rule that when the person asks for the box by name, it builds the box without asking again, because the request is the go-ahead. None tells an agent to act without the person's say-so."
  - rule_id: "EA2"
    file: "references/CONTRACT.md"
    reason: "False positive. Texts that describe what an agent may do on its own and give no such instruction: the why text on an edge in an example box file, which a renderer prints for a reader; the labels, headings and comments in a format check, its bindings and its README that name the settings the check warns on because they let an agent act without asking; a step that lists unconfirmed drafts as Proposed without asking about each one, which keeps them unconfirmed until the person agrees; and eagle-eye's rule that when the person asks for the box by name, it builds the box without asking again, because the request is the go-ahead. None tells an agent to act without the person's say-so."
  - rule_id: "P2"
    file: "SKILL.md"
    reason: "False positive, two kinds. The rule reads get inside any HTML comment with no word boundary, so the word together in a page-template comment about two buttons wrapping as one group matches it; those comments are notes on layout for a maintainer, and no agent reads the rendered page as instructions. And the contract skill's part fences: one begin and one end comment line around each generated part of a SKILL.md, naming the part so an amendment can regenerate it alone. The fence holds a part's name and nothing else, and the text between two fences is the skill's ordinary, visible instructions."
  - rule_id: "RA2"
    file: "references/binding-codex.md"
    reason: "Three findings, one rule. False positive: the CONTRIBUTING.md rule forbidding a fixed path inside a skill, and the test proving that rule fires; a guard and its test, both reported as the risk they exist to prevent. Not a false positive, and accepted: eagle-eye's usage log keeps a start and an end line per box in a file in the person's home folder, across sessions, and only after the person says yes in chat. A no is stored as one declined marker. The skill never writes inside its own folder. Also accepted: the contract skill's bindings name the folders where a person's agents already live, such as .codex/agents/, so a built agent written there loads in later sessions. The skill asks the person before any write that would install, and writes no agent without the person's go. Also accepted: the contract skill's hiring page keeps a person's answers in the browser until they press Forget, unencrypted, the accepted risk of 2026-10-18."
  - rule_id: "LP3"
    file: "SKILL.md"
    reason: "Accepted. The skill declares no permission list, because a permission list is one host's format and the skill's text runs in agents that read none. SECURITY.md in the repository says which script reaches the network, when it runs, and what it sends."
  - rule_id: "MP1"
    file: "*contract.changelog.md"
    reason: "False positive. The words a permanent rule in the contract skill's change log, in the row that records why the skill was rebuilt: every earlier review finding had become a permanent rule, and nothing let one be dropped. It describes the skill's past for a person reading its history, and the skill tells an agent to read the change log only when someone asks what changed."
  - rule_id: "RA2"
    file: "README.md"
    reason: "Three findings, one rule. False positive: the CONTRIBUTING.md rule forbidding a fixed path inside a skill, and the test proving that rule fires; a guard and its test, both reported as the risk they exist to prevent. Not a false positive, and accepted: eagle-eye's usage log keeps a start and an end line per box in a file in the person's home folder, across sessions, and only after the person says yes in chat. A no is stored as one declined marker. The skill never writes inside its own folder. Also accepted: the contract skill's bindings name the folders where a person's agents already live, such as .codex/agents/, so a built agent written there loads in later sessions. The skill asks the person before any write that would install, and writes no agent without the person's go. Also accepted: the contract skill's hiring page keeps a person's answers in the browser until they press Forget, unencrypted, the accepted risk of 2026-10-18."
  - rule_id: "EA3"
    file: "assets/OFL.txt"
    reason: "False positive. The phrase NOT LIMITED TO, in the warranty disclaimer of the SIL Open Font Licence that ships beside the vendored font faces. It is a legal text the licence requires us to carry verbatim, not an instruction an agent obeys, and its wording is not ours to change."
