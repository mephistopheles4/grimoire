# SkillSpector baseline for this skill.
#
# You are reading this because you scanned this directory before installing
# what is in it, which is the right thing to do with a skill. Six of
# SkillSpector's rules fire on the files here. Five are wrong and one is
# accepted, and this file says why, so you can disagree with a reason rather
# than with silence.
#
# The first finding is on `README.md`, where a sentence names the `npx skills`
# installer to say what that route installs and what it does not. The rule
# reads any `npx` with no version as an MCP server that could change under
# you. It is a quotation of the install command, not a server, and the skill
# itself runs nothing through npx.
#
# The second is on `CONTRACT.md`, whose checkpoint log names the skill's own
# `SKILL.md`, the file the contract generates. The rule reads any path to a
# `SKILL.md` as one skill reading another's. The skill reads no other skill.
#
# The third, fourth and fifth fire on the relay scripts in `scripts/`: a
# skill that ships a script declares no permission list (accepted, since a
# permission list is one host's format); a `delete` of a closed entry in the
# scripts' own state reads as tampering with an agent's memory; and a function
# returning the relay rule it parsed reads as leaking a system prompt; and a
# copy of the environment handed to `gh` reads as opening a credential file.
#
# The scanner reports the score unchanged and applies none of this unless you
# ask. Apply it with --use-shipped-baseline, and read what it covered with
# --show-suppressed.
#
# Each entry is keyed by rule identifier rather than by a fingerprint of the
# text it matched, so it survives an edit to the prose, and it suppresses the
# rule across this directory. Nothing here was reworded to satisfy a pattern
# matcher.
#
# The repository this skill comes from carries the same entries, in the same
# words, in the file at its root. Its check refuses a change that makes the
# two disagree.

version: 2
fingerprints: []

rules:
  - rule_id: "AS3"
    reason: "False positive. A README line naming the one skill this repository ships, the decision records quoting that line, and a skill's contract naming the SKILL.md it was drafted from. Naming your own product or its own source file is not enumerating somebody else's."
  - rule_id: "RP1"
    reason: "False positive. The README install command and quotations of it. skills is the Vercel Labs installer run through npx, not an MCP server, so there is no server version to pin."
  - rule_id: "LP3"
    reason: "Accepted. The skill declares no permission list, because a permission list is one host's format and the skill's text runs in agents that read none. SECURITY.md in the repository says which script reaches the network, when it runs, and what it sends."
  - rule_id: "MP3"
    reason: "False positive. Two kinds of line, neither an agent's memory: a comment in eagle-eye's page template describing how Reset discards the reader's overrides and Undo offers them back, which documents a button; and head-chef's relay scripts deleting a closed question or relay from their own state file with the JavaScript delete operator."
  - rule_id: "P6"
    reason: "False positive. head-chef's relay scripts return the relay rule they parsed from a start prompt to their own code. It is a value the script checks and prints nowhere, not a system prompt or a hidden instruction."
  - rule_id: "PE3"
    reason: "False positive. Two kinds of line, neither opening a credential file: the string .env in eagle-eye's edge audit setup message and its test, which tell a user that a project .env file is not read, since the audit reads its key from the environment only; and head-chef's relay scripts copying process.env for the gh they start, with the host and repository settings removed."
