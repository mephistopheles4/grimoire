# SkillSpector baseline for this skill.
#
# You are reading this because you scanned this directory before installing
# what is in it, which is the right thing to do with a skill. Four of
# SkillSpector's rules fire on the files here. All four are wrong, and this
# file says why, so you can disagree with a reason rather than with silence.
#
# The first finding is on `README.md`, where a sentence names the `npx skills`
# installer to say what that route installs and what it does not. The rule
# reads any `npx` with no version as an MCP server that could change under
# you. It is a quotation of the install command, not a server, and the skill
# itself runs nothing through npx.
#
# The second is on the description in `SKILL.md`. The rule reads a clause that
# holds a common command word, such as run, beside a slash command as a skill
# taking over that command. Here run and start are verbs about sessions, and
# the slash command is the skill's own, /head-chef. Its entry matches that one
# clause exactly as the scanner quotes it, with no wildcard and ignoring case.
# The scanner quotes up to 120 characters either side of the slash command, so
# the rule still fires on any other clause, and on this one once any word
# inside that window changes. Words outside the window it does not read.
#
# The third, P2, fires on the comment lines that fence each generated part of
# `SKILL.md`. A fence names its part and nothing else; the text between two
# fences is the skill's ordinary, visible instructions.
#
# The fourth, EA2, fires on "without asking again" in cleanup, in `SKILL.md`
# and in `references/CONTRACT.md`: on the owner's one yes, which covers the
# whole name-back list, the head chef runs its checks again and does not ask a
# second time. It acts on the owner's yes, never without it.
#
# Both are whole-file entries. P2 is off for all of `SKILL.md`, so an
# instruction hidden there in a comment, a link-reference comment or a base64
# data link would pass the scan; EA2 is off for all of `SKILL.md` and
# `references/CONTRACT.md`. Review of those files holds what the scan does not.
#
# The scanner reports the score unchanged and applies none of this unless you
# ask. Apply it with --use-shipped-baseline, and read what it covered with
# --show-suppressed.
#
# Each entry except TR2 names the one file its rule fired on when the entries were
# measured, with SkillSpector v2.13.0 on 2026-10-17, and P2 and EA2 on
# 2026-10-21. The path is exact, and the
# scanner matches it ignoring letter case. A finding of the same rule in any
# other file is reported, and it fails this repository's build. That holds for a
# scan of this skill's own folder. A scanner that ignores `file` applies each
# entry to the whole folder.
#
# An entry that names a file and no message covers every finding of its rule
# anywhere in that file, not only the line it was measured on: README.md for
# RP1. The TR2 entry keeps the star and the exact clause the root's entry has,
# and reads only a skill's frontmatter. A new instruction of the RP1 kind in
# README.md passes the scan, and review is what holds it.
#
# Each entry is keyed by rule identifier rather than by a fingerprint of the
# text it matched, so it survives an edit to the prose. Nothing here was
# reworded to satisfy a pattern matcher.
#
# The repository this skill comes from carries the same rules, in the same
# words, in the file at its root. That file is rule-wide, for a scan of the
# whole repository, and the entries here are narrower. Its check lets a skill's
# entry be narrower than the root's, never broader.

version: 2
fingerprints: []

rules:
  - rule_id: "RP1"
    file: "README.md"
    reason: "False positive. The README install command and quotations of it. skills is the Vercel Labs installer run through npx, not an MCP server, so there is no server version to pin."
  - rule_id: "TR2"
    file: "*SKILL.md"
    message: "e asks for work to run in another session, to start or hand off to a new session, or to lead several sessions, or types /head-chef"
    reason: "False positive. The rule reads a skill description as taking over a built-in command when one clause holds a common command word and a slash command. The head-chef skill is for someone who asks for work to run in another session, or to start one, or who types /head-chef: run and start are verbs about sessions there, and the only slash command is the skill's own name. The skill takes over no built-in command."
  - rule_id: "P2"
    file: "SKILL.md"
    reason: "False positive, two kinds. The rule reads get inside any HTML comment with no word boundary, so the word together in a page-template comment about two buttons wrapping as one group matches it; those comments are notes on layout for a maintainer, and no agent reads the rendered page as instructions. And the contract skill's part fences: one begin and one end comment line around each generated part of a SKILL.md, naming the part so an amendment can regenerate it alone. The fence holds a part's name and nothing else, and the text between two fences is the skill's ordinary, visible instructions."
  - rule_id: "EA2"
    file: "SKILL.md"
    reason: "False positive. Texts that describe what an agent may do on its own and give no such instruction: the why text on an edge in an example box file, which a renderer prints for a reader; the labels, headings and comments in a format check, its bindings and its README that name the settings the check warns on because they let an agent act without asking; a step that lists unconfirmed drafts as Proposed without asking about each one, which keeps them unconfirmed until the person agrees; eagle-eye's rule that when the person asks for the box by name, it builds the box without asking again, because the request is the go-ahead; head-chef's cleanup, which reads each item again without asking again once the owner's one yes covers the whole name-back list; and head-chef's level 3, which takes the owner's kept decisions toward a goal without a per-act word only after the owner confirms that level and states the goal in the lead's chat. None tells an agent to act without the person's say-so: at level 3 that confirmation is the say-so."
  - rule_id: "EA2"
    file: "references/CONTRACT.md"
    reason: "False positive. Texts that describe what an agent may do on its own and give no such instruction: the why text on an edge in an example box file, which a renderer prints for a reader; the labels, headings and comments in a format check, its bindings and its README that name the settings the check warns on because they let an agent act without asking; a step that lists unconfirmed drafts as Proposed without asking about each one, which keeps them unconfirmed until the person agrees; eagle-eye's rule that when the person asks for the box by name, it builds the box without asking again, because the request is the go-ahead; head-chef's cleanup, which reads each item again without asking again once the owner's one yes covers the whole name-back list; and head-chef's level 3, which takes the owner's kept decisions toward a goal without a per-act word only after the owner confirms that level and states the goal in the lead's chat. None tells an agent to act without the person's say-so: at level 3 that confirmation is the say-so."
