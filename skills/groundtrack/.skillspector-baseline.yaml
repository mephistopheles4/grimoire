# SkillSpector baseline for this skill.
#
# You are reading this because you scanned this directory before installing
# what is in it, which is the right thing to do with a skill. Two of
# SkillSpector's rules fire on the files here, and a third fires depending on
# where the files sit. The two are wrong, the third is right and accepted, and
# this file says which and why, so you can disagree with a reason rather than
# with silence.
#
# The accepted one is on `SKILL.md`: the skill declares no permission list. It
# fires only when the filesystem marks every file executable — a Windows drive
# seen through WSL or a container mount does — because the scanner decides
# what is code partly from that mark. On an ordinary checkout it stays quiet. A
# permission list is one host's format, and this skill's text runs in agents
# that read none. Its renderer reads the file you give it and writes one page
# where you tell it to; it reaches no network.
#
# The first finding is on `assets/OFL.txt`, which is the SIL Open Font Licence. That
# file is here because the licence requires it: three weights of IBM Plex Mono
# ship in `assets/` and are inlined into every page this skill renders, and the
# licence asks that its text travel with them. See `assets/FONTS.md`.
#
# The second is on the HTML comments in `assets/template.html`. The rule looks
# for "get" inside a comment and has no word boundary, so "together" matches.
#
# The scanner reports the score unchanged and applies none of this unless you
# ask. Apply it with --use-shipped-baseline, and read what it covered with
# --show-suppressed.
#
# Each entry names the one file its rule fired on when the entries were
# measured, with SkillSpector v2.13.0 on 2026-10-17. The path is exact, and the
# scanner matches it ignoring letter case. A finding of the same rule in any
# other file is reported, and it fails this repository's build. That holds for a
# scan of this skill's own folder. A scanner that ignores `file` applies each
# entry to the whole folder.
#
# An entry that names a file and no message covers every finding of its rule
# anywhere in that file, not only the line it was measured on: assets/OFL.txt
# for EA3, assets/template.html for P2 and SKILL.md for LP3. A new instruction of
# one of those kinds in a named file passes the scan, and review is what holds
# it. The LP3 entry names SKILL.md because that is where the rule lands in a
# skill that trips it. That was not measured on a mount that marks every file
# executable, so a report on another file there reaches you as new.
#
# Nothing here was reworded to satisfy a pattern matcher, and the licence text
# could not be even if somebody wanted to.
#
# The repository this skill comes from carries the same rules at its root,
# rule-wide, for a scan of the whole repository, covering the rules that fire
# outside this directory. Its check lets a skill's entry be narrower than the
# root's, never broader.

version: 2
fingerprints: []

rules:
  - rule_id: "LP3"
    file: "SKILL.md"
    reason: "Accepted. The skill declares no permission list, because a permission list is one host's format and the skill's text runs in agents that read none. SECURITY.md in the repository says which script reaches the network, when it runs, and what it sends."
  - rule_id: "EA3"
    file: "assets/OFL.txt"
    reason: "False positive. The phrase NOT LIMITED TO, in the warranty disclaimer of the SIL Open Font Licence that ships beside the vendored font faces. It is a legal text the licence requires us to carry verbatim, not an instruction an agent obeys, and its wording is not ours to change."
  - rule_id: "P2"
    file: "assets/template.html"
    reason: "False positive, two kinds. The rule reads get inside any HTML comment with no word boundary, so the word together in a page-template comment about two buttons wrapping as one group matches it; those comments are notes on layout for a maintainer, and no agent reads the rendered page as instructions. And the contract skill's part fences: one begin and one end comment line around each generated part of a SKILL.md, naming the part so an amendment can regenerate it alone. The fence holds a part's name and nothing else, and the text between two fences is the skill's ordinary, visible instructions."
