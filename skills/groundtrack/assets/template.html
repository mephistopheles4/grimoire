<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>groundtrack — /*TITLE*/</title>
<style>
/* The three faces are vendored and inlined as data URIs. This page makes no
   network request at all: a font CDN is a dependency on somebody else's
   uptime, some hosts will not load one, and a drawing whose monospace silently
   degrades is a worse drawing. */
/*FONTS*/

:root {
  --dw-paper: #fafaf7; --dw-ink: #22262b; --dw-caution: #d97706; --dw-normal: #15803d;
  --dw-ink-80: rgb(34 38 43 / 0.8); --dw-ink-55: rgb(34 38 43 / 0.55);
  --dw-ink-30: rgb(34 38 43 / 0.3); --dw-ink-12: rgb(34 38 43 / 0.12); --dw-grid: rgb(34 38 43 / 0.05);
  --dw-rule-hair: 1px; --dw-rule-thin: 1.5px; --dw-rule-bold: 2px; --dw-grid-size: 24px;
  --dw-font: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --dw-t-micro: 0.6875rem; --dw-t-annot: 0.8125rem; --dw-t-body: 0.9375rem;
  --dw-t-lead: 1.125rem; --dw-t-h3: 1.375rem;
  --dw-track-label: 0.16em;
  --dw-s1: 6px; --dw-s2: 12px; --dw-s3: 24px; --dw-s4: 36px;
}
* { box-sizing: border-box; }
body { margin: 0; background-color: var(--dw-paper); color: var(--dw-ink);
  font-family: var(--dw-font); font-size: var(--dw-t-body); line-height: 1.6; }
.dw-label { font-size: var(--dw-t-micro); text-transform: uppercase;
  letter-spacing: var(--dw-track-label); font-weight: 500; color: var(--dw-ink-55); }
.dw-annot { font-size: var(--dw-t-annot); line-height: 1.45; color: var(--dw-ink-55); }
.dw-state { display: inline-flex; align-items: center; gap: var(--dw-s1);
  font-size: var(--dw-t-micro); text-transform: uppercase; letter-spacing: var(--dw-track-label);
  padding: 3px var(--dw-s2); border: var(--dw-rule-hair) solid currentColor; }
.dw-state::before { content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; flex: none; }
.dw-state--caution { color: var(--dw-caution); }
.dw-state--normal { color: var(--dw-normal); }
.none { color: var(--dw-ink-30); }
.dim { color: var(--dw-ink-55); }
.ok { color: var(--dw-normal); }
.caut { color: var(--dw-caution); }

/* The sheet. Every region is defined by how fast what it holds changes, and
   each control sits with what it acts on. The cutaway opens at 12rem, measured
   as the smallest cut that still shows a small node's whole tape. */
.sheet-root { --side-w: 22rem; --cut-h: 12rem; height: 100vh;
  display: grid; grid-template-columns: 1fr var(--side-w);
  grid-template-rows: auto 1fr var(--cut-h) auto;
  grid-template-areas: 'head head' 'plan side' 'cut side' 'block block';
  background: var(--dw-paper); overflow: hidden; }

/* Head — the run picker and the step controls. It drives the walk. */
.head { grid-area: head; display: flex; align-items: center; gap: var(--dw-s3);
  padding: var(--dw-s2) var(--dw-s3);
  border-bottom: var(--dw-rule-bold) solid var(--dw-ink); flex-wrap: wrap; }
.head-id { display: flex; align-items: baseline; gap: var(--dw-s2); min-width: 0; }
.head-title { font-size: var(--dw-t-lead); font-weight: 600; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 28rem; }
select, button, input { font: inherit; font-size: var(--dw-t-micro); color: var(--dw-ink);
  background: var(--dw-paper); border: var(--dw-rule-hair) solid var(--dw-ink-30);
  border-radius: 0; padding: 4px var(--dw-s2); }
select { font-size: var(--dw-t-annot); border-color: var(--dw-ink);
  border-width: var(--dw-rule-thin); max-width: 22rem; }
.btn { text-transform: uppercase; letter-spacing: var(--dw-track-label); font-weight: 500;
  cursor: pointer; transition: color 150ms, border-color 150ms; }
.btn:hover { border-color: var(--dw-ink); }
.btn[disabled] { color: var(--dw-ink-30); cursor: default; border-color: var(--dw-ink-12); }
.btn-group { display: flex; gap: var(--dw-s1); margin-left: auto; align-items: center; }
.stepnow { font-size: var(--dw-t-micro); letter-spacing: var(--dw-track-label);
  font-variant-numeric: tabular-nums; color: var(--dw-ink-55); min-width: 6rem; text-align: right; }

/* Plan — the drawing. Pan and zoom are load-bearing: it does not fit at 1:1. */
.plan { grid-area: plan; overflow: hidden; position: relative;
  border-right: var(--dw-rule-bold) solid var(--dw-ink); cursor: grab;
  background-image:
    linear-gradient(to right, var(--dw-grid) var(--dw-rule-hair), transparent var(--dw-rule-hair)),
    linear-gradient(to bottom, var(--dw-grid) var(--dw-rule-hair), transparent var(--dw-rule-hair));
  background-size: var(--dw-grid-size) var(--dw-grid-size); }
.plan.grabbing { cursor: grabbing; }
#canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; padding: var(--dw-s4); }
#wires { position: absolute; inset: 0; overflow: visible; pointer-events: none; }

/* The tool block. Every control that changes how this sheet is READ, and none
   that drive the walk. One row per tool, with a fixed key column so the rows
   read as a table of controls. It sits under five percent of the plan pane and
   the fit view leaves that corner empty. */
.toolblock { position: absolute; top: var(--dw-s2); right: var(--dw-s2); z-index: 4;
  display: flex; flex-direction: column; align-items: stretch; background: var(--dw-paper);
  border: var(--dw-rule-thin) solid var(--dw-ink); }
.toolblock .grp { display: flex; align-items: stretch; }
.toolblock .grp + .grp { border-top: var(--dw-rule-hair) solid var(--dw-ink-30); }
.toolblock .grp-k { width: 4.5rem; flex: none; text-align: left;
  border-right: var(--dw-rule-hair) solid var(--dw-ink-12);
  padding: 3px var(--dw-s2); font-size: var(--dw-t-micro);
  text-transform: uppercase; letter-spacing: var(--dw-track-label); color: var(--dw-ink-30);
  align-self: center; }
.toolblock button { border: 0; border-left: var(--dw-rule-hair) solid var(--dw-ink-12);
  background: transparent; padding: 3px var(--dw-s2); font-size: var(--dw-t-micro);
  text-transform: uppercase; letter-spacing: var(--dw-track-label); color: var(--dw-ink-55);
  cursor: pointer; border-bottom: var(--dw-rule-bold) solid transparent; transition: color 150ms; }
.toolblock .grp button:first-of-type { border-left: 0; }
.toolblock button:hover { color: var(--dw-ink); }
.toolblock button.on { color: var(--dw-ink); border-bottom-color: var(--dw-ink); }
.toolblock button[disabled] { color: var(--dw-ink-30); cursor: default; }
.toolblock .now { padding: 3px var(--dw-s2); font-size: var(--dw-t-micro);
  letter-spacing: var(--dw-track-label); font-variant-numeric: tabular-nums;
  align-self: center; min-width: 4.5rem; text-align: center;
  border-left: var(--dw-rule-hair) solid var(--dw-ink-12); }
.toolblock .why { padding: 3px var(--dw-s2); font-size: var(--dw-t-micro);
  color: var(--dw-ink-30); max-width: 16rem; line-height: 1.35;
  border-left: var(--dw-rule-hair) solid var(--dw-ink-12); text-transform: none;
  letter-spacing: normal; }

/* A node is a part on the drawing. */
.nd { position: absolute; width: 288px; background: var(--dw-paper);
  border: var(--dw-rule-bold) solid var(--dw-ink); padding: var(--dw-s2);
  cursor: pointer; overflow: hidden; transition: border-color 150ms; }
.nd--cold { border-width: var(--dw-rule-hair); border-color: var(--dw-ink-30); color: var(--dw-ink-55); }
.nd--sel { outline: var(--dw-rule-thin) solid var(--dw-ink); outline-offset: 7px; }
/* On the stack now: the double rule. No colour spent — position is not a state. */
.nd--active { outline: var(--dw-rule-hair) solid var(--dw-ink-30); outline-offset: 4px; }
.nd--error { border-color: var(--dw-caution); }
.nd-top { display: flex; align-items: center; gap: var(--dw-s1); margin-bottom: 2px; }
.nd-name { font-weight: 600; font-size: var(--dw-t-body); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.nd-loc { font-size: var(--dw-t-micro); color: var(--dw-ink-55);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nd-ch { display: grid; grid-template-columns: 1.2rem 1fr; gap: 0 var(--dw-s1);
  font-size: var(--dw-t-micro); margin-top: var(--dw-s1); padding-top: var(--dw-s1);
  border-top: var(--dw-rule-hair) solid var(--dw-ink-12); }
.nd-ch b { font-weight: 600; }
.nd-ch span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fx { display: flex; align-items: center; gap: var(--dw-s1); font-size: var(--dw-t-micro);
  color: var(--dw-ink-55); margin-top: 3px; }
.fx-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--dw-ink-30); flex: none; }
.fx-lead { width: var(--dw-s2); border-top: var(--dw-rule-thin) solid var(--dw-ink-30); flex: none; }
.fx-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fx--ok .fx-dot { background: var(--dw-normal); }
.fx--ok .fx-lead { border-top-color: var(--dw-normal); }
.fx--fail .fx-dot { background: var(--dw-caution); }
.fx--fail .fx-lead { border-top-color: var(--dw-caution); }
.nd-cut { font-size: var(--dw-t-micro); color: var(--dw-caution); margin-top: 3px; }

/* The tree. The same file and the same walk, on paper. Stepping works here;
   only the animation goes. */
.tree { padding: var(--dw-s4) var(--dw-s3); overflow: auto; height: 100%;
  display: none; flex-direction: column; gap: 2px; }
.sheet-root.tree-on .tree { display: flex; }
.sheet-root.tree-on #canvas, .sheet-root.tree-on #wires { display: none; }
.tr { display: flex; align-items: baseline; gap: var(--dw-s2); padding: 5px var(--dw-s2);
  background: var(--dw-paper); font-size: var(--dw-t-annot);
  border: var(--dw-rule-hair) solid var(--dw-ink-12);
  border-left: var(--dw-rule-bold) solid transparent; cursor: pointer; }
.tr--cold { color: var(--dw-ink-55); }
.tr--active { border-left-color: var(--dw-ink); background: var(--dw-grid); }
.tr-name { font-weight: 600; min-width: 15rem; white-space: nowrap; }
.tr-kind { min-width: 4.5rem; flex: none; }
.tr-ch { font-size: var(--dw-t-micro); white-space: nowrap; }
.tr-ch b { font-weight: 600; }
.tr-site { font-size: var(--dw-t-micro); white-space: nowrap; }
.tr-fxs { margin-left: auto; display: flex; gap: var(--dw-s2); flex: none; }
.tr-fx { font-size: var(--dw-t-micro); color: var(--dw-ink-55); white-space: nowrap; }

/* The rail. It reads the walk, and it moves on every step. Deleting it changes
   the drawing's scale by nothing, so what goes in it is never an argument
   about the drawing. */
.side { grid-area: side; overflow-y: auto; display: flex; flex-direction: column; }
.blk { padding: var(--dw-s2) var(--dw-s3) var(--dw-s3);
  border-bottom: var(--dw-rule-hair) solid var(--dw-ink-12); }
.blk > .dw-label { display: block; margin-bottom: var(--dw-s1); }
/* The holds sit at the top of the rail, over the blocks they watch. The head
   drives the walk forward; the holds say where it stops. */
.blk.holds { display: flex; gap: var(--dw-s3); align-items: center; flex-wrap: wrap;
  padding: var(--dw-s2) var(--dw-s3); border-bottom: var(--dw-rule-bold) solid var(--dw-ink); }
.row { display: flex; gap: var(--dw-s1); font-size: var(--dw-t-annot); align-items: baseline; }
.row-k { color: var(--dw-ink-55); flex: none; }
.row-v { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frame { display: block; width: 100%; text-align: left; border: 0;
  border-left: var(--dw-rule-bold) solid transparent; padding: 2px var(--dw-s2);
  cursor: pointer; background: transparent; font-size: var(--dw-t-annot); }
.frame--top { border-left-color: var(--dw-ink); }
.var { display: flex; align-items: baseline; gap: var(--dw-s1); margin-bottom: 2px; }
.var-k { width: 6rem; flex: none; font-size: var(--dw-t-micro); color: var(--dw-ink-55);
  text-align: right; }
.var-v { min-width: 0; flex: 1; font-size: var(--dw-t-micro); overflow-wrap: anywhere; }
.led { display: flex; gap: var(--dw-s1); font-size: var(--dw-t-micro); padding: 2px 0;
  border-bottom: var(--dw-rule-hair) solid var(--dw-ink-12); }
.led:last-child { border-bottom: 0; }
.led-seq { color: var(--dw-ink-30); flex: none; }
.led-body { min-width: 0; flex: 1; }
.led-body div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* The cutaway. One node — its source, its files, its declared contract. */
.cut { grid-area: cut; border-top: var(--dw-rule-bold) solid var(--dw-ink);
  border-right: var(--dw-rule-bold) solid var(--dw-ink);
  display: flex; flex-direction: column; min-height: 0; }
.cut-head { display: flex; align-items: baseline; gap: var(--dw-s2);
  padding: var(--dw-s1) var(--dw-s3); border-bottom: var(--dw-rule-hair) solid var(--dw-ink-12); }
.tape { flex: 1; overflow: auto; padding: var(--dw-s2) var(--dw-s3) var(--dw-s3); }
.tabs { margin-left: auto; display: flex; gap: var(--dw-s2); }
.tab { border: 0; background: transparent; padding: 2px 0; font-size: var(--dw-t-micro);
  text-transform: uppercase; letter-spacing: var(--dw-track-label); color: var(--dw-ink-55);
  cursor: pointer; border-bottom: var(--dw-rule-bold) solid transparent;
  transition: color 150ms, border-color 150ms; }
.tab--on { color: var(--dw-ink); border-bottom-color: var(--dw-ink); }
.tp { display: flex; align-items: flex-start; gap: var(--dw-s2); font-size: var(--dw-t-annot);
  line-height: 1.5; padding: 1px 0 1px var(--dw-s2);
  border-left: var(--dw-rule-bold) solid transparent; }
.tp--here { border-left-color: var(--dw-ink); background: var(--dw-grid); }
.tp-n { width: 1.5rem; text-align: right; color: var(--dw-ink-30);
  font-size: var(--dw-t-micro); flex: none; padding-top: 2px; }
.tp-lbl { width: 5rem; flex: none; font-size: var(--dw-t-micro); text-transform: uppercase;
  letter-spacing: var(--dw-track-label); color: var(--dw-ink-55); padding-top: 2px; }
.tp-src { min-width: 0; flex: 1; overflow-wrap: anywhere; }
.kw { font-weight: 600; }
.fgroup { margin-bottom: var(--dw-s3); }
.fgroup > .dw-label { display: block; margin-bottom: var(--dw-s1); }
.frow { display: grid; grid-template-columns: 4.5rem 1fr 5rem; gap: var(--dw-s2);
  align-items: baseline; font-size: var(--dw-t-annot); padding: 1px 0; }
.fwhy { grid-column: 2 / -1; font-size: var(--dw-t-micro); color: var(--dw-ink-55); }
.fchange { font-size: var(--dw-t-micro); text-transform: uppercase;
  letter-spacing: var(--dw-track-label); color: var(--dw-ink-55); }
.fpath { min-width: 0; overflow-wrap: anywhere; }
.fnum { text-align: right; font-variant-numeric: tabular-nums; font-size: var(--dw-t-micro);
  color: var(--dw-ink-55); }

/* The footer band states the sheet. Only the trace moves. */
.block { grid-area: block; border-top: var(--dw-rule-bold) solid var(--dw-ink); }
.dw-titleblock { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.dw-titleblock-cell { padding: var(--dw-s2) var(--dw-s3);
  border-right: var(--dw-rule-hair) solid var(--dw-ink-12);
  display: flex; flex-direction: column; gap: var(--dw-s1); min-width: 0; }
.dw-titleblock-cell:last-child { border-right: 0; }
.dw-titleblock-key { font-size: var(--dw-t-micro); text-transform: uppercase;
  letter-spacing: var(--dw-track-label); color: var(--dw-ink-55); }
.dw-titleblock-val { font-size: var(--dw-t-body); font-variant-numeric: tabular-nums;
  overflow-wrap: break-word; }
/* The provenance stamp. Authored draws as a bordered caution stamp, captured
   as a nominal one — one of green's few honest uses. */
.stamp { align-self: flex-start; }
.trace { padding: var(--dw-s2) var(--dw-s3);
  border-top: var(--dw-rule-hair) solid var(--dw-ink-12); }
.traceband { display: flex; align-items: center; gap: var(--dw-s4); }
.sheetfacts { display: flex; align-items: baseline; gap: var(--dw-s3); flex: none;
  font-size: var(--dw-t-micro); color: var(--dw-ink-55); white-space: nowrap;
  max-width: 46rem; overflow: hidden; text-overflow: ellipsis; }
.sheetfacts span + span { padding-left: var(--dw-s3);
  border-left: var(--dw-rule-hair) solid var(--dw-ink-12); }
.sheetfacts b { font-weight: 600; color: var(--dw-ink); }
.trace-span { position: relative; flex: 1; height: 18px; display: flex; align-items: center;
  cursor: pointer; }
.trace-rule { position: absolute; inset: 50% 0 auto; height: 0;
  border-top: var(--dw-rule-thin) solid var(--dw-ink-30); }
.trace-fill { position: absolute; inset: 50% auto auto 0; height: 0;
  border-top: var(--dw-rule-bold) solid var(--dw-ink); }
.trace-tick { position: absolute; top: 0; bottom: 0; width: 0;
  border-left: var(--dw-rule-bold) solid var(--dw-ink); }
.dw-dimension-value { font-size: var(--dw-t-micro); letter-spacing: var(--dw-track-label);
  text-transform: uppercase; color: var(--dw-ink-55); font-variant-numeric: tabular-nums;
  white-space: nowrap; }

/* The direction of a call is something a reader sees rather than works out. */
@keyframes flow { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
@keyframes flow-rev { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 24; } }
.wire--flow { stroke-dasharray: 6 6; animation: flow 480ms linear; }
.wire--flow-rev { stroke-dasharray: 6 6; animation: flow-rev 480ms linear; }
@media (prefers-reduced-motion: reduce) {
  .wire--flow, .wire--flow-rev { animation: none; }
}
.refused { padding: var(--dw-s4); max-width: 60rem; }
.refused h1 { font-size: var(--dw-t-h3); }
.refused li { font-size: var(--dw-t-annot); }
</style>
</head>
<body>
<div class="sheet-root" id="root">
  <div class="head">
    <div class="head-id">
      <span class="dw-label">groundtrack</span>
      <span class="head-title" id="title"></span>
    </div>
    <label class="dw-label" for="run">run</label>
    <select id="run" title="Which recorded walk to step"></select>
    <span class="dw-annot" id="runBlurb"></span>
    <div class="btn-group">
      <button class="btn" id="first" title="Back to the start">|&lt;</button>
      <button class="btn" id="prev" title="Step back one move">&lt;</button>
      <button class="btn" id="play" title="Run the walk">play</button>
      <button class="btn" id="next" title="Step forward one move">&gt;</button>
      <button class="btn" id="last" title="Jump to the end">&gt;|</button>
      <span class="stepnow" id="stepnow"></span>
    </div>
  </div>

  <div class="plan" id="plan">
    <div class="toolblock">
      <div class="grp">
        <span class="grp-k">zoom</span>
        <button id="zoomOut" title="Zoom out">&minus;</button>
        <button id="zoomFit" title="Fit the whole drawing">fit</button>
        <button id="zoomIn" title="Zoom in">+</button>
        <span class="now" id="scaleNow">1:1</span>
      </div>
      <div class="grp" id="layerGrp">
        <span class="grp-k">layer</span>
      </div>
      <div class="grp">
        <span class="grp-k">view</span>
        <button id="viewPlan" class="on">plan</button>
        <button id="viewTree">tree</button>
      </div>
    </div>
    <div id="canvas"></div>
    <div class="tree" id="tree"></div>
  </div>

  <div class="side">
    <div class="blk holds">
      <label class="dw-label"><input type="checkbox" id="holdEffect"> hold on next effect</label>
      <label class="dw-label"><input type="checkbox" id="holdError"> hold on next error</label>
    </div>
    <div class="blk"><span class="dw-label">call stack</span><div id="stack"></div></div>
    <div class="blk"><span class="dw-label">inputs</span><div id="inputs"></div></div>
    <div class="blk"><span class="dw-label">error path</span><div id="errpath"></div></div>
    <div class="blk"><span class="dw-label">effects ledger</span><div id="ledger"></div></div>
  </div>

  <div class="cut">
    <div class="cut-head">
      <span class="dw-label">cutaway</span>
      <strong id="cutName"></strong>
      <span class="dw-annot" id="cutLoc"></span>
      <div class="tabs">
        <button class="tab tab--on" data-tab="source">source</button>
        <button class="tab" data-tab="files">files</button>
        <button class="tab" data-tab="contract">contract</button>
      </div>
    </div>
    <div class="tape" id="cutBody"></div>
  </div>

  <div class="block">
    <div class="dw-titleblock" id="titleblock"></div>
    <div class="trace">
      <div class="traceband">
        <div class="sheetfacts" id="sheetfacts"></div>
        <div class="trace-span" id="traceSpan" title="Click to move the cursor">
          <div class="trace-rule"></div>
          <div class="trace-fill" id="traceFill"></div>
          <div class="trace-tick" id="traceTick"></div>
        </div>
        <span class="dw-dimension-value" id="traceVal"></span>
      </div>
    </div>
  </div>
</div>

<script>/*MODULE*/</script>
<script>
"use strict";
/* The player may derive, never decide. It pushes a frame, pops a frame,
   appends a ledger row and moves a cursor — all of that in the shared module,
   which the tests run too. It evaluates nothing, and this page contains no
   dynamic code evaluation at all. */
const PROG = /*DATA*/;
const G = Groundtrack;
const esc = G.esc;
const $ = id => document.getElementById(id);

/* The page holds the walk to the graph before drawing it. A move naming a step
   the node has not got, or a pop with no frame open, is refused rather than
   drawn. */
function holdToGraph(prog) {
  const bad = [];
  if (!prog.nodes || !prog.nodes[prog.entry]) bad.push('the entry node is not in the graph');
  for (const p of prog.presets || []) {
    let depth = 1;
    (p.walk.steps || []).forEach((m, i) => {
      if (m.k === 'unwind' || m.k === 'return') {
        if (depth < 1) bad.push('run "' + p.name + '" move ' + i + ': ' + m.k + ' with no frame open');
        depth -= 1;
      } else if (m.k === 'call') {
        if (!prog.nodes[m.to]) bad.push('run "' + p.name + '" move ' + i + ': calls "' + m.to + '", which is not a node');
        depth += 1;
      } else if (m.k === 'done' || m.k === 'uncaught') {
        depth = 0;
      }
    });
  }
  return bad;
}

const refusals = holdToGraph(PROG);
if (refusals.length) {
  document.body.innerHTML =
    '<div class="refused"><h1>This file does not hold together, so nothing is drawn.</h1><ul>' +
    refusals.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') +
    '</ul></div>';
} else {
  start();
}

function start() {
  const LAYOUT = G.layout(PROG);
  const layerNames = Object.keys(PROG.layers || {});
  const CUTS = G.cutEdges(PROG);

  const S = {
    run: 0,
    at: 0,
    states: G.fold(PROG, PROG.presets[0].walk),
    layer: layerNames.length ? layerNames[0] : null,
    open: PROG.entry,
    tab: 'source',
    tree: false,
    zoom: 1,
    panX: 0,
    panY: 0,
    playing: null,
    redraw: null,
  };

  /* -- what a node shows, under the layer in force ------------------------ */
  const rOf = id => {
    const layer = S.layer ? PROG.layers[S.layer] : null;
    const ov = layer && layer.nodes && layer.nodes[id];
    return ov && ov.R ? ov.R : (PROG.nodes[id].channels || {}).R || [];
  };
  const cutsFrom = (from, at) => CUTS.filter(c => c.layer === S.layer && c.from === from && c.at === at);
  const layerEntry = () => {
    const layer = S.layer ? PROG.layers[S.layer] : null;
    return (layer && layer.entry) || PROG.entry;
  };
  /* Everything the call edges cannot reach from the layer's own entry draws as
     unreached. The geometry is untouched; only the ink changes. */
  const reachable = () => {
    const seen = new Set();
    (function go(id) {
      if (seen.has(id)) return;
      seen.add(id);
      (PROG.nodes[id].steps || []).forEach((s, i) => {
        if (s.op !== 'call' || !PROG.nodes[s.target]) return;
        if (cutsFrom(id, i).length) return;
        go(s.target);
      });
    })(layerEntry());
    return seen;
  };

  /* -- the drawing -------------------------------------------------------- */
  function drawWires(st, reach) {
    const onStack = new Set(st.frames.map(f => f.nodeId));
    const taken = new Set(st.edges);
    const parts = [];
    parts.push(
      '<defs>' +
        '<marker id="ar-cold" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">' +
        '<path d="M0,0 L8,4 L0,8 z" fill="rgb(34 38 43 / 0.3)"></path></marker>' +
        '<marker id="ar-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">' +
        '<path d="M0,0 L8,4 L0,8 z" fill="#22262b"></path></marker>' +
        '</defs><g>',
    );
    for (const e of LAYOUT.edges) {
      const key = e.from + '>' + e.to;
      const live = onStack.has(e.from) && onStack.has(e.to);
      const walked = taken.has(key);
      const cut = CUTS.some(c => c.layer === S.layer && c.from === e.from && c.to === e.to);
      const cold = cut || !reach.has(e.to);
      const w = cold ? 1 : live ? 2 : walked ? 1.5 : 1;
      const col = !cold && (live || walked) ? '#22262b' : 'rgb(34 38 43 / 0.3)';
      const mk = !cold && (live || walked) ? 'ar-ink' : 'ar-cold';
      let cls = '';
      if (S.redraw && S.redraw.from === e.from && S.redraw.to === e.to) cls = ' class="wire--flow"';
      if (S.redraw && S.redraw.from === e.to && S.redraw.to === e.from) cls = ' class="wire--flow-rev"';
      parts.push(
        '<path' + cls + ' d="' + e.call + '" fill="none" stroke="' + col + '" stroke-width="' + w +
          '" stroke-dasharray="' + (cut ? '4 4' : 'none') + '" marker-end="url(#' + mk + ')"></path>',
      );
      if (e.hasE) {
        parts.push(
          '<path d="' + e.err + '" fill="none" stroke="rgb(34 38 43 / 0.3)" stroke-width="1" ' +
            'stroke-dasharray="4 4" marker-end="url(#ar-cold)"></path>',
        );
      }
    }
    parts.push('</g>');
    return (
      '<svg id="wires" viewBox="0 0 ' + LAYOUT.canvasW + ' ' + LAYOUT.canvasH +
      '" style="width:' + LAYOUT.canvasW + 'px;height:' + LAYOUT.canvasH + 'px" xmlns="http://www.w3.org/2000/svg">' +
      parts.join('') + '</svg>'
    );
  }

  function nodeBox(id, st, reach) {
    const n = PROG.nodes[id];
    const ch = n.channels || {};
    const p = LAYOUT.pos[id];
    const onStack = st.frames.some(f => f.nodeId === id);
    const top = st.frames.length && st.frames[st.frames.length - 1].nodeId === id;
    const visited = st.visited.indexOf(id) >= 0;
    const erroring = st.errorPath.some(e => e.nodeId === id && (e.how === 'raised' || e.how === 'thrown'));
    const cold = !reach.has(id) || !visited;
    const cls =
      'nd' + (cold ? ' nd--cold' : '') + (onStack ? ' nd--active' : '') +
      (erroring ? ' nd--error' : '') + (S.open === id ? ' nd--sel' : '');
    const chip = top
      ? '<span class="dw-label" style="margin-left:auto">on stack</span>'
      : onStack
        ? '<span class="dw-label" style="margin-left:auto">waiting</span>'
        : visited
          ? '<span style="margin-left:auto"><span class="dw-state dw-state--normal">returned</span></span>'
          : '';
    const E = (ch.E || []).length ? (ch.E || []).map(esc).join(' &middot; ') : '<span class="none">never</span>';
    const R = rOf(id).length ? esc(rOf(id).join(', ')) : '<span class="none">none</span>';
    // Keyed by node, not by call site. The drawing shows one box per node, so
    // a mark read off the open frame would disappear the moment that frame
    // returned — while the tree, which is one row per call site, kept it.
    const fx = G.effectsOf(n)
      .map(function (e) {
        const mark = st.nodeEffects[id + '[' + e.at + ']'];
        const k = mark === 'failed' ? ' fx--fail' : mark === 'landed' ? ' fx--ok' : '';
        return (
          '<div class="fx' + k + '"><span class="fx-dot"></span><span class="fx-lead"></span>' +
          '<span class="fx-txt">' + esc(e.kind) + ' <span class="dim">' + esc(e.desc) + '</span></span></div>'
        );
      })
      .join('');
    const cutNote = CUTS.filter(c => c.layer === S.layer && c.to === id).length
      ? '<div class="nd-cut">cut under ' + esc(S.layer) + '</div>'
      : '';
    return (
      '<div class="' + cls + '" data-node="' + id + '" style="left:' + p.x + 'px;top:' + p.y +
      'px;width:' + LAYOUT.width + 'px">' +
      '<div class="nd-top"><span class="dw-label">' + esc(n.role) + '</span>' + chip + '</div>' +
      '<div class="nd-name">' + esc(n.name) + '</div>' +
      '<div class="nd-loc">' + esc(n.loc) + '</div>' +
      '<div class="nd-ch"><b>A</b><span>' + esc(ch.A || '—') + '</span>' +
      '<b>E</b><span>' + E + '</span><b>R</b><span>' + R + '</span></div>' +
      fx + cutNote + '</div>'
    );
  }

  /* -- the tree ----------------------------------------------------------- */
  function drawTree() {
    const rows = G.treeRows(PROG, PROG.presets[S.run].walk, S.layer, S.at, S.states);
    return rows
      .map(function (row) {
        const cls =
          'tr' + (row.state === 'not reached' ? ' tr--cold' : '') + (row.state === 'on stack' ? ' tr--active' : '');
        const E = row.E.length ? row.E.map(esc).join(' &middot; ') : '<span class="none">never</span>';
        const rr = row.rename && row.rename.length ? row.rename : row.R;
        const R = rr.length ? esc(rr.join(', ')) : '<span class="none">none</span>';
        const marks = row.effects
          .map(function (f) {
            const k = f.mark === 'failed' ? 'caut' : f.mark === 'landed' ? 'ok' : 'none';
            return '<span class="tr-fx">&middot; ' + esc(f.kind) + ' <span class="' + k + '">' + esc(f.mark) + '</span></span>';
          })
          .join('');
        const siteText = row.site && (row.site.label || row.site.aside)
          ? '<span class="tr-site dim">' + esc(row.site.aside || row.site.label) + '</span>'
          : '';
        return (
          '<div class="' + cls + '" data-node="' + row.id + '" style="padding-left:' + (row.depth * 24) + 'px">' +
          '<span class="tr-name">' + (row.depth ? '&rarr; ' : '') + esc(row.name) +
          (row.repeat ? ' <span class="none">(seen above — stopped)</span>' : '') + '</span>' +
          '<span class="dw-label tr-kind">' + esc(row.role) + '</span>' +
          '<span class="tr-ch"><b>A</b> ' + esc(row.A || '—') + ' &nbsp; <b>E</b> ' + E + ' &nbsp; <b>R</b> ' + R + '</span>' +
          siteText + '<span class="tr-fxs">' + marks + '</span></div>'
        );
      })
      .join('');
  }

  /* -- the rail ----------------------------------------------------------- */
  function drawStack(st) {
    if (!st.frames.length) return '<div class="dw-annot">no frame open</div>';
    return st.frames
      .slice()
      .reverse()
      .map(function (f, i) {
        const n = PROG.nodes[f.nodeId];
        return (
          '<button class="frame' + (i === 0 ? ' frame--top' : '') + '" data-node="' + f.nodeId + '">' +
          esc(n.name) + ' <span class="dim">[' + f.pc + ']</span></button>'
        );
      })
      .join('');
  }

  const show = v => (typeof v === 'string' ? v : JSON.stringify(v));

  function drawInputs() {
    const input = PROG.presets[S.run].input || {};
    const keys = Object.keys(input);
    if (!keys.length) return '<div class="dw-annot">this run starts from nothing</div>';
    return keys
      .map(function (k) {
        return '<div class="var"><span class="var-k">' + esc(k) + '</span><span class="var-v">' + esc(show(input[k])) + '</span></div>';
      })
      .join('');
  }

  function drawErrPath(st) {
    if (!st.errorPath.length) return '<div class="dw-annot">nothing has raised</div>';
    return st.errorPath
      .map(function (e) {
        const who = e.nodeId ? PROG.nodes[e.nodeId].name : 'the top';
        const tag = e.tag ? ' <b>' + esc(e.tag) + '</b>' : '';
        const msg = e.message ? ' <span class="dim">' + esc(e.message) + '</span>' : '';
        const ch = e.channel ? ' <span class="caut">' + esc(e.channel) + '</span>' : '';
        return '<div class="row"><span class="row-k">' + esc(who) + '</span><span class="row-v">' + esc(e.how) + tag + ch + msg + '</span></div>';
      })
      .join('');
  }

  function drawLedger(st) {
    if (!st.ledger.length) return '<div class="dw-annot">nothing touched the outside world yet</div>';
    return st.ledger
      .map(function (l, i) {
        const mark = l.outcome === 'failed'
          ? '<span class="caut">raised ' + esc(l.raised.tag) + ' — ' + esc(l.raised.message) + '</span>'
          : '<span class="ok">' + (l.result === undefined ? 'went on' : esc(show(l.result))) + '</span>';
        return (
          '<div class="led"><span class="led-seq">' + (i + 1) + '</span><span class="led-body">' +
          '<div>' + esc(l.kind) + ' <span class="dim">' + esc(l.desc) + '</span></div>' +
          '<div>' + mark + '</div></span></div>'
        );
      })
      .join('');
  }

  /* -- the cutaway -------------------------------------------------------- */
  function drawSource(st) {
    const n = PROG.nodes[S.open];
    const here = st.frames.filter(f => f.nodeId === S.open).map(f => f.pc);
    return (n.steps || [])
      .map(function (s, i) {
        const body =
          s.op === 'note' ? '<span class="dim">' + esc(s.note) + '</span>'
          : s.op === 'let' ? '<span class="kw">let</span> ' + esc(s.name) + ' = ' + esc(s.expr)
          : s.op === 'if' ? '<span class="kw">if</span> ' + esc(s.cond) + ' &rarr; ' + esc(s.then) + ' <span class="kw">else</span> ' + esc(s.else)
          : s.op === 'goto' ? '<span class="kw">goto</span> ' + esc(s.to)
          : s.op === 'call' ? '<span class="kw">call</span> ' + esc(s.target)
          : s.op === 'effect' ? '<span class="kw">effect</span> ' + esc(s.kind) + ' <span class="dim">' + esc(s.desc) + '</span>'
          : s.op === 'throw' ? '<span class="kw">throw</span> ' + esc(s.tag) + ' <span class="caut">' + esc(s.channel) + '</span> <span class="dim">' + esc(s.message) + '</span>'
          : '<span class="kw">return</span> ' + esc(s.expr);
        const aside = s.aside ? '<div class="dim">' + esc(s.aside) + '</div>' : '';
        const handlers = (s.onError || [])
          .map(function (h) { return '<div class="dim">on ' + esc(h.tag) + ' &rarr; ' + esc(h.goto) + '</div>'; })
          .join('');
        return (
          '<div class="tp' + (here.indexOf(i) >= 0 ? ' tp--here' : '') + '">' +
          '<span class="tp-n">' + i + '</span>' +
          '<span class="tp-lbl">' + (s.label ? esc(s.label) : '') + '</span>' +
          '<span class="tp-src">' + body + aside + handlers + '</span></div>'
        );
      })
      .join('');
  }

  /* One list answers all three questions: what this node changes, what other
     nodes on this sheet change, and what the change touches that no node
     accounts for. */
  function drawFiles() {
    const n = PROG.nodes[S.open];
    const mine = new Set(n.touches || []);
    const others = new Set();
    for (const [id, o] of Object.entries(PROG.nodes)) {
      if (id === S.open) continue;
      for (const p of o.touches || []) others.add(p);
    }
    const all = PROG.files || [];
    const byPath = {};
    for (const f of all) byPath[f.path] = f;
    const rowOf = p => {
      const f = byPath[p] || { path: p, change: 'edit', why: '', adds: 0, dels: 0 };
      return (
        '<div class="frow"><span class="fchange">' + esc(f.change) + '</span>' +
        '<span class="fpath">' + esc(f.path) + '</span>' +
        '<span class="fnum">+' + esc(f.adds) + ' &minus;' + esc(f.dels) + '</span>' +
        (f.why ? '<span class="fwhy">' + esc(f.why) + '</span>' : '') + '</div>'
      );
    };
    const group = (label, paths) =>
      '<div class="fgroup"><span class="dw-label">' + label + '</span>' +
      (paths.length ? paths.map(rowOf).join('') : '<div class="dw-annot">none</div>') + '</div>';
    const unaccounted = all.filter(f => !mine.has(f.path) && !others.has(f.path)).map(f => f.path);
    return (
      group('this node', [...mine]) +
      group('other nodes on this sheet', [...others]) +
      group('in the change, on no node', unaccounted)
    );
  }

  function drawContract() {
    const n = PROG.nodes[S.open];
    const ch = n.channels || {};
    const line = (k, v) => '<div class="row"><span class="row-k" style="width:8rem">' + k + '</span><span class="row-v">' + v + '</span></div>';
    return (
      line('role', esc(n.role)) +
      line('takes', (n.params || []).length ? esc((n.params || []).join(', ')) : '<span class="none">nothing</span>') +
      line('A — returns', esc(ch.A || '—')) +
      line('E — breaks', (ch.E || []).length ? esc((ch.E || []).join(', ')) : '<span class="none">never</span>') +
      line('R — needs', rOf(S.open).length ? esc(rOf(S.open).join(', ')) : '<span class="none">nothing</span>') +
      line('entered by', (n.enteredBy || []).length ? esc((n.enteredBy || []).join(', ')) : '<span class="none">no spec calls this node</span>')
    );
  }

  /* -- the footer band ---------------------------------------------------- */
  function drawTitleBlock() {
    const run = PROG.presets[S.run];
    const authored = run.walk.provenance === 'authored';
    const cell = (k, v) => '<div class="dw-titleblock-cell"><span class="dw-titleblock-key">' + k + '</span><span class="dw-titleblock-val">' + v + '</span></div>';
    const stamp =
      '<span class="dw-state stamp ' + (authored ? 'dw-state--caution' : 'dw-state--normal') + '">' +
      (authored ? 'authored' : 'captured') + '</span>';
    return (
      cell('file', esc(PROG.id)) +
      cell('nodes', String(Object.keys(PROG.nodes).length)) +
      cell('runs', String(PROG.presets.length)) +
      cell('changed files', PROG.files ? String(PROG.files.length) : '<span class="none">not stated</span>') +
      cell('walk', stamp)
    );
  }

  function drawSheetFacts() {
    const bits = [];
    bits.push('<span><b>blurb</b> ' + esc(PROG.blurb) + '</span>');
    if (PROG.sheet && PROG.sheet.scopeRule) bits.push('<span><b>scope rule</b> ' + esc(PROG.sheet.scopeRule) + '</span>');
    if (PROG.sheet && (PROG.sheet.graphsNotDrawn || []).length) {
      bits.push('<span><b>not drawn</b> ' + esc(PROG.sheet.graphsNotDrawn.join(', ')) + '</span>');
    }
    return bits.join('');
  }

  /* -- render ------------------------------------------------------------- */
  function render() {
    const st = S.states[S.at];
    const reach = reachable();
    $('title').textContent = PROG.title;
    $('runBlurb').textContent = PROG.presets[S.run].blurb;
    $('canvas').innerHTML = drawWires(st, reach) + LAYOUT.order.map(id => nodeBox(id, st, reach)).join('');
    $('canvas').style.transform = 'translate(' + S.panX + 'px,' + S.panY + 'px) scale(' + S.zoom + ')';
    $('tree').innerHTML = drawTree();
    $('stack').innerHTML = drawStack(st);
    $('inputs').innerHTML = drawInputs();
    $('errpath').innerHTML = drawErrPath(st);
    $('ledger').innerHTML = drawLedger(st);
    $('cutName').textContent = PROG.nodes[S.open].name;
    $('cutLoc').textContent = PROG.nodes[S.open].loc;
    $('cutBody').innerHTML = S.tab === 'source' ? drawSource(st) : S.tab === 'files' ? drawFiles() : drawContract();
    $('titleblock').innerHTML = drawTitleBlock();
    $('sheetfacts').innerHTML = drawSheetFacts();

    const n = S.states.length - 1;
    $('stepnow').textContent = S.at + ' / ' + n;
    $('traceFill').style.width = (n ? (S.at / n) * 100 : 0) + '%';
    $('traceTick').style.left = (n ? (S.at / n) * 100 : 0) + '%';
    $('traceVal').textContent = st.ended ? st.ended : S.at === 0 ? 'not started' : 'running';
    $('prev').disabled = S.at === 0;
    $('first').disabled = S.at === 0;
    $('next').disabled = S.at >= n;
    $('last').disabled = S.at >= n;
    $('scaleNow').textContent = '1:' + (1 / S.zoom).toFixed(2);
    $('root').classList.toggle('tree-on', S.tree);
    S.redraw = null;
  }

  /* -- stepping ----------------------------------------------------------- */
  const holdsHere = i => {
    const m = S.states[i].move;
    if (!m) return false;
    if ($('holdEffect').checked && m.k === 'effect') return true;
    if ($('holdError').checked && (m.k === 'throw' || m.k === 'uncaught' || (m.k === 'effect' && m.raised !== undefined))) return true;
    return false;
  };

  function step(dir) {
    const n = S.states.length - 1;
    const to = Math.min(n, Math.max(0, S.at + dir));
    if (to === S.at) return false;
    if (dir > 0) {
      S.redraw = S.states[to].moved;
    } else {
      /* Stepping back over a call redraws it callee to caller, so unwinding
         reads as unwinding. */
      const b = G.back(S.states, S.at);
      S.redraw = b.redraw ? { from: b.redraw.from, to: b.redraw.to } : null;
    }
    S.at = to;
    render();
    return true;
  }

  function play() {
    if (S.playing) {
      clearInterval(S.playing);
      S.playing = null;
      $('play').textContent = 'play';
      return;
    }
    $('play').textContent = 'stop';
    S.playing = setInterval(function () {
      if (!step(1) || holdsHere(S.at)) {
        clearInterval(S.playing);
        S.playing = null;
        $('play').textContent = 'play';
      }
    }, 520);
  }

  /* -- wiring ------------------------------------------------------------- */
  PROG.presets.forEach(function (p, i) {
    const o = document.createElement('option');
    o.value = String(i);
    o.textContent = p.name + ' — ' + p.blurb;
    $('run').appendChild(o);
  });
  $('run').addEventListener('change', function (e) {
    S.run = Number(e.target.value);
    S.states = G.fold(PROG, PROG.presets[S.run].walk);
    S.at = 0;
    render();
  });

  $('next').addEventListener('click', function () { step(1); });
  $('prev').addEventListener('click', function () { step(-1); });
  $('first').addEventListener('click', function () { S.at = 0; render(); });
  $('last').addEventListener('click', function () { S.at = S.states.length - 1; render(); });
  $('play').addEventListener('click', play);

  $('traceSpan').addEventListener('click', function (e) {
    const box = e.currentTarget.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (e.clientX - box.left) / box.width));
    S.at = Math.round(frac * (S.states.length - 1));
    render();
  });

  /* The toggle offers every layer the file declares, so a file with three
     layers does not get two buttons. A file that declares none disables it and
     says why. */
  const grp = $('layerGrp');
  if (!layerNames.length) {
    const b = document.createElement('button');
    b.textContent = 'none';
    b.disabled = true;
    grp.appendChild(b);
    const why = document.createElement('span');
    why.className = 'why';
    why.textContent = 'This file declares no layer map, so there is no second set of dependencies to redraw under.';
    grp.appendChild(why);
  } else {
    layerNames.forEach(function (name) {
      const b = document.createElement('button');
      b.textContent = name;
      b.className = name === S.layer ? 'on' : '';
      b.addEventListener('click', function () {
        S.layer = name;
        [...grp.querySelectorAll('button')].forEach(function (x) { x.className = x.textContent === name ? 'on' : ''; });
        render();
      });
      grp.appendChild(b);
    });
  }

  $('viewPlan').addEventListener('click', function () {
    S.tree = false;
    $('viewPlan').className = 'on';
    $('viewTree').className = '';
    $('zoomIn').disabled = false;
    $('zoomOut').disabled = false;
    $('zoomFit').disabled = false;
    render();
  });
  $('viewTree').addEventListener('click', function () {
    S.tree = true;
    $('viewTree').className = 'on';
    $('viewPlan').className = '';
    /* Zoom has nothing to act on in the tree, so it greys out. */
    $('zoomIn').disabled = true;
    $('zoomOut').disabled = true;
    $('zoomFit').disabled = true;
    render();
  });

  const setZoom = z => { S.zoom = Math.min(2, Math.max(0.15, z)); render(); };
  $('zoomIn').addEventListener('click', function () { setZoom(S.zoom * 1.25); });
  $('zoomOut').addEventListener('click', function () { setZoom(S.zoom / 1.25); });
  $('zoomFit').addEventListener('click', function () {
    const box = $('plan').getBoundingClientRect();
    S.panX = 0;
    S.panY = 0;
    setZoom(Math.min(box.width / (LAYOUT.canvasW + 72), box.height / (LAYOUT.canvasH + 72)));
  });

  [...document.querySelectorAll('.tab')].forEach(function (t) {
    t.addEventListener('click', function () {
      S.tab = t.getAttribute('data-tab');
      [...document.querySelectorAll('.tab')].forEach(function (x) {
        x.className = 'tab' + (x === t ? ' tab--on' : '');
      });
      render();
    });
  });

  document.addEventListener('click', function (e) {
    const el = e.target.closest ? e.target.closest('[data-node]') : null;
    if (!el) return;
    S.open = el.getAttribute('data-node');
    render();
  });

  /* Pan. The drawing does not fit at 1:1 in any arrangement, so this is
     load-bearing rather than a convenience. */
  let drag = null;
  $('plan').addEventListener('pointerdown', function (e) {
    if (e.target.closest('.toolblock') || e.target.closest('[data-node]')) return;
    drag = { x: e.clientX - S.panX, y: e.clientY - S.panY };
    $('plan').classList.add('grabbing');
  });
  window.addEventListener('pointermove', function (e) {
    if (!drag) return;
    S.panX = e.clientX - drag.x;
    S.panY = e.clientY - drag.y;
    $('canvas').style.transform = 'translate(' + S.panX + 'px,' + S.panY + 'px) scale(' + S.zoom + ')';
  });
  window.addEventListener('pointerup', function () {
    drag = null;
    $('plan').classList.remove('grabbing');
  });

  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });

  render();
  $('zoomFit').click();
}
</script>
</body>
</html>
